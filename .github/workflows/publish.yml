name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: github.repository == 'nfeldman/amanuensis'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Require tag to match package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=critical
      - name: Verify packed artifact
        run: node test-package-artifact.mjs
      - name: Publish as latest
        run: npm publish --access public --tag latest
