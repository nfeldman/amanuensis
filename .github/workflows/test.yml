name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  roadmap:
    name: Roadmap structure and projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Validate roadmap and generated projection
        run: node dev/render-roadmap.mjs --check
      - name: Prove roadmap validation red gates
        run: node dev/test-roadmap.mjs
      - name: Verify Pecia execution custody matches the roadmap
        run: node dev/test-pecia-roadmap.mjs && node dev/test-pecia-roadmap-red-gates.mjs
      - name: Verify versioned historical A0 conspectus baseline
        run: node dev/check-living-conspectus.mjs
      - name: Prove living-conspectus gates and clean-export read-back
        run: node dev/test-living-conspectus.mjs
      # GATE CF2 (design/survey-depth/spec.md §8.9). Not a packet gate: every
      # red condition is a property of dev/pecia-resolve-finding.mjs, which P4
      # delivers, so it is proved inside P4's red commit and runs here from
      # then on. It copies the resolver into a throwaway repository root and
      # builds the store it reads, so it needs the built server and nothing
      # else this runner does not already have.
      - name: Carried-finding references — a destroyed referent is not a reopened one
        run: node dev/test-carried-finding-references.mjs

  # The Amanuensis→Pecia defect projection. Pecia is a uv PEP-723 script in a
  # separate PRIVATE repository, so this gate cannot run from a bare checkout.
  # It is opt-in rather than skip-by-default-inside-a-passing-job: a gate that
  # goes green without its subject present is the zero-denominator failure this
  # repository has already recorded three times (B03-2, B04-1, B04-3). A skipped
  # job reads as not-run; a passing step that silently did nothing does not.
  #
  # To enable: set repository variable PECIA_GATE_ENABLED=true and provide
  # secret PECIA_REPO_TOKEN with read access to nfeldman/pecia. Once enabled the
  # job is load-bearing — a failure to obtain pecia turns it red rather than
  # quietly passing.
  pecia-defects:
    name: Amanuensis → Pecia defect projection
    if: vars.PECIA_GATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Obtain the pecia CLI
        env:
          PECIA_REPO_TOKEN: ${{ secrets.PECIA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PECIA_REPO_TOKEN" || {
            echo "PECIA_GATE_ENABLED is true but PECIA_REPO_TOKEN is unset." >&2
            echo "Provide the token or unset the variable; this gate does not skip silently." >&2
            exit 1
          }
          git clone --depth 1 \
            "https://x-access-token:${PECIA_REPO_TOKEN}@github.com/nfeldman/pecia.git" "$RUNNER_TEMP/pecia"
          chmod +x "$RUNNER_TEMP/pecia/pecia_cli.py"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/pecia/pecia_cli.py" "$RUNNER_TEMP/bin/pecia"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: pecia is runnable
        run: pecia --help > /dev/null
      - name: Defect projection red gates
        run: node dev/test-amanuensis-pecia-defects.mjs
      - name: The committed ledger is well-formed and every reference resolves
        run: |
          set -euo pipefail
          pecia check
          pecia audit > audit.json
          node -e '
            const a = JSON.parse(require("fs").readFileSync("audit.json", "utf8"));
            const findings = Array.isArray(a) ? a : (a.findings ?? []);
            const bad = findings.filter((f) => f.kind === "unresolvable-reference");
            if (bad.length) {
              console.error("amanuensis references that no longer resolve:", JSON.stringify(bad, null, 2));
              process.exit(1);
            }
            console.log("every amanuensis: reference in the committed ledger resolves");
          '

  mcp-server:
    name: MCP server (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The rebuild gates below resolve every receipt revision against
          # the history; at the default depth 1 they could not evaluate it.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Install
        working-directory: mcp-server
        run: npm ci
      - name: Audit dependencies
        working-directory: mcp-server
        run: npm audit --audit-level=critical
      - name: Lint (Biome)
        working-directory: mcp-server
        run: npx biome check src/
      - name: Build
        working-directory: mcp-server
        run: npm run build
      - name: SQL identifiers resolve against schema
        working-directory: mcp-server
        run: node scripts/check-sql-identifiers.mjs
      - name: Tool inputSchemas are valid JSON Schema
        working-directory: mcp-server
        run: node scripts/check-tool-schemas.mjs
      - name: MCP initialization, annotations, structured results, and error semantics
        working-directory: mcp-server
        run: node test-mcp-compatibility.mjs
      - name: Smoke test (every tool)
        working-directory: mcp-server
        run: node test-smoke.mjs
      - name: Storage-dir git integration
        working-directory: mcp-server
        run: node test-storage-git.mjs
      # GATE XS1 (design/survey-depth/spec.md §8.0a) runs the additive migration
      # on a copy of a real populated store. Its subject is machine-local and
      # private, so a bare runner cannot hold it — which is exactly the state
      # that must not read as a pass. The gate answers `cannot run` with exit 2
      # there, and this step asserts that third state on every run: a gate that
      # went green without its store would be the zero-denominator failure this
      # repository has recorded three times (B03-2, B04-1, B04-3).
      #
      # To run the gate itself, set repository variable XS1_GATE_ENABLED=true
      # and XS1_SOURCE_STORE to a readable copy of a populated store on the
      # runner. Once enabled the job below is load-bearing.
      - name: Existing-store migration reports cannot run, never green, with no store
        working-directory: mcp-server
        env:
          AMANUENSIS_XS1_SOURCE_STORE: ${{ runner.temp }}/no-such-amanuensis-store.db
        run: |
          set +e
          out=$(node test-existing-store-migration.mjs 2>&1); status=$?
          printf '%s\n' "$out"
          test "$status" -eq 2 || { echo "expected exit 2 (cannot run), got $status" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P0 CANNOT RUN: ' || { echo "no cannot-run line" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P0 GREEN' && { echo "reported green with no store" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P0 RED: ' && { echo "offered a cannot run as a red proof" >&2; exit 1; }
          exit 0
      - name: Existing-store migration on a real populated store
        if: vars.XS1_GATE_ENABLED == 'true'
        working-directory: mcp-server
        env:
          AMANUENSIS_XS1_SOURCE_STORE: ${{ vars.XS1_SOURCE_STORE }}
        run: |
          set -euo pipefail
          test -n "${AMANUENSIS_XS1_SOURCE_STORE}" || {
            echo "XS1_GATE_ENABLED is true but XS1_SOURCE_STORE is unset." >&2
            echo "Provide the store path or unset the variable; this gate does not skip silently." >&2
            exit 1
          }
          node test-existing-store-migration.mjs
      - name: Cloud-mode storage (shared conspectus repo, nested-repo detection)
        working-directory: mcp-server
        run: node test-cloud-storage.mjs
      - name: Autoprogress infrastructure (open_questions + mode detection)
        working-directory: mcp-server
        run: node test-autoprogress.mjs
      - name: Conspectus comparison tool
        working-directory: mcp-server
        run: node test-compare.mjs
      - name: Subsystem priority (schema migration + ranking math)
        working-directory: mcp-server
        run: node test-priority.mjs
      - name: Cloud-harness end-to-end simulation
        working-directory: mcp-server
        run: node test-cloud-e2e.mjs
      - name: Installer CLI
        working-directory: mcp-server
        run: node test-installer.mjs
      - name: Codex user activation and wrong-workspace red gate
        working-directory: mcp-server
        run: node test-activation-contract.mjs
      - name: Activation doctor and digest-bound repair red gate
        working-directory: mcp-server
        run: node test-activation-doctor.mjs
      - name: Immutable repository binding and containment red gate
        working-directory: mcp-server
        run: node test-workspace-binding.mjs
      - name: Codex parent-process workspace selection
        working-directory: mcp-server
        run: node test-codex-parent-workspace.mjs
      - name: Nested Codex activation selects the Git root lazily
        working-directory: mcp-server
        run: node test-nested-activation-binding.mjs
      - name: Lazy first use leaves an untouched repository unchanged
        working-directory: mcp-server
        run: node test-first-use-laziness.mjs
      - name: First-use initialization recovers at every mutation boundary
        working-directory: mcp-server
        run: node test-first-use-recovery.mjs
      - name: Committed real-host Codex evidence and independent red gates
        run: node dev/check-codex-host-evidence.mjs --receipt dev/activation-evidence/a22-codex-host.json && node dev/test-codex-host-evidence-red-gates.mjs
      - name: Packed artifact adapters and MCP handshake
        working-directory: mcp-server
        run: node test-package-artifact.mjs
      - name: Source and clean-packed activation parity
        working-directory: mcp-server
        run: node test-package-activation-parity.mjs
      - name: Prove packed cwd and skill-version parity red gates
        run: node dev/test-package-activation-parity-red-gates.mjs
      - name: Committed multi-repository operating evidence and no-pooling red gates
        run: node dev/check-activation-operating-envelope.mjs --receipt dev/activation-evidence/a25-activation-operating-envelope.json && node dev/test-activation-operating-envelope-red-gates.mjs && node dev/test-activation-operating-trust-cleanup.mjs
      - name: Exact-package rollback preserves five repository stores
        working-directory: mcp-server
        run: node test-release-rollback.mjs
      - name: Friction-free release readiness, projection, and missing-evidence red gates
        run: node dev/check-friction-free-release-readiness.mjs --report dev/activation-evidence/a26-release-readiness.json && node dev/test-friction-free-release-readiness-red-gates.mjs && node dev/render-friction-free-release-readiness.mjs --check
      - name: Adversarial — correctness
        working-directory: mcp-server
        run: node test-adversarial-correctness.mjs
      - name: Invariants — knowledge-depth gates + monotonic transitions
        working-directory: mcp-server
        run: node test-invariants.mjs
      # GATE SD1 (design/survey-depth/spec.md §8.1). Its fixtures are a
      # temporary git workspace and a store it creates itself, so unlike GATE
      # XS1 above it needs nothing this runner does not already have.
      - name: Evidence-backed dispositions — set_disposition's inputs and the advance refusal
        working-directory: mcp-server
        run: node test-disposition-evidence.mjs
      # GATE SR1 (design/survey-depth/spec.md §8.2). Its fixtures are temporary
      # git workspaces and stores it creates itself; its one publishing arm
      # needs the materializer and a python3, which the projection gates above
      # already require of this runner.
      - name: Scope reconciliation — the record, the standing predicate, the two refusals
        working-directory: mcp-server
        run: node test-scope-reconciliation.mjs
      # GATE VD1 (design/survey-depth/spec.md §8.3). Its fixtures are temporary
      # git workspaces and stores it creates itself; one arm spawns the built
      # server over stdio to read tools/list, which the reader-lens gates above
      # already require of this runner.
      - name: Vocabulary discharge — anchors that resolve, and declining out loud
        working-directory: mcp-server
        run: node test-vocabulary-discharge.mjs
      # GATE CF1 (design/survey-depth/spec.md §8.4). Its fixtures are temporary
      # git workspaces, stores and archives it creates itself — the frozen
      # clean-slate archive is deliberately not read here, because a gate whose
      # red proof needs a machine-local file cannot be proved on a clean
      # checkout (§8.0 clause 3). Some arms drive the rebuild driver and the
      # built server over stdio, both of which the gates above already require.
      - name: Carried findings — the carry, its counts, and the three authority rules
        working-directory: mcp-server
        run: node test-carried-findings.mjs
      - name: Derived staleness — ledger drift and scope reconciliation
        working-directory: mcp-server
        run: node test-derived-staleness.mjs
      - name: Startup bounds — no unbounded probe on the activation path
        working-directory: mcp-server
        run: node test-startup-bounds.mjs
      - name: Generated enum modules match the vocabulary source
        working-directory: mcp-server
        run: node scripts/gen-vocabulary.mjs --check
      - name: SQL CHECK literals match the vocabulary source
        working-directory: mcp-server
        run: node scripts/gen-vocabulary.mjs --check-sql
      - name: Evidence vocabulary — the source, both generated files, and SKILL.md agree
        working-directory: mcp-server
        run: node scripts/check-evidence-vocabulary.mjs
      # design/survey-depth/spec.md §8.10. The calibrated concern checklist and
      # the finding-id convention used to be literals inside
      # dev/test-rebuild-depth.mjs, which counts a survey's concern coverage
      # against them; a denominator read out of the document that reports the
      # coverage lets a dropped concern shrink both halves at once. They live in
      # a standalone contract no rebuild packet rewrites, and this is what keeps
      # that contract from becoming a literal with a longer path. Its document
      # arm needs nothing but the repository; its calibration arm reports itself
      # unrun where no store exists rather than passing silently.
      - name: Concern checklist — the calibrated codes, the territories, the finding-id convention
        working-directory: mcp-server
        run: node scripts/check-concern-checklist.mjs
      # design/survey-depth/spec.md §6.2. The same shape as the check above and
      # for the same reason: a fact published in two places needs something that
      # compares them. Here the two places are the server's refusal messages and
      # the skill references that instruct the calls those refusals now stop.
      # Its third and fourth assertions derive the candidate set from the
      # server's own messages, so a refusal nobody registered is reported rather
      # than passed over in silence (§8.7).
      - name: Refusal parity — the register, the server's own words, and every caller
        working-directory: mcp-server
        run: node scripts/check-refusal-parity.mjs
      # GATE RP1 (design/survey-depth/spec.md §8.7). It builds its own fixture
      # parity tree and sabotages it one edit at a time, so it needs nothing this
      # runner does not already have.
      - name: Refusal parity red gates — the check fires, and names what drifted
        working-directory: mcp-server
        run: node test-refusal-parity.mjs
      - name: Single enum source — generated files, SQL CHECKs, validators, hint tables
        working-directory: mcp-server
        run: node test-vocabulary-source.mjs
      - name: Finding partition — one state view, five readers, one page per finding
        working-directory: mcp-server
        run: node test-finding-partition.mjs
      - name: Locus standing — the file_standing view, kind inference, reachability
        working-directory: mcp-server
        run: node test-locus-index-view.mjs
      - name: describe_locus — the account, its contract, and read-only annotations
        working-directory: mcp-server
        run: node test-locus-standing.mjs
      - name: Locus compactness — wire budgets and the omission ledger
        working-directory: mcp-server
        run: node test-locus-compactness.mjs
      - name: Residual hardening — revision-bound writers, one open-finding predicate
        working-directory: mcp-server
        run: node test-residual-hardening.mjs
      - name: Temporal claims — intervals, supersession, migration, compatibility
        working-directory: mcp-server
        run: node test-temporal-claims.mjs
      - name: Structural claims — add_claim's substrate checks and the narrative fallback
        working-directory: mcp-server
        run: node test-structural-claims.mjs
      - name: Phase 2 claims — the claim_key prerequisite on 'structural'
        working-directory: mcp-server
        run: node test-phase2-claims-gate.mjs
      - name: Cited edges — add_xref's citation contract and topology from recorded rows
        working-directory: mcp-server
        run: node test-edge-contract.mjs
      - name: Attention and history — operational labels, census reconciliation, budgets
        working-directory: mcp-server
        run: node test-attention-history.mjs
      - name: Consumer route — instructions, annotations, inventory, skill route, installer
        working-directory: mcp-server
        run: node test-consumer-route.mjs
      # Runs from the repository root: it drives spawned server processes across
      # a real deletion, and reads the committed receipt of the live run.
      - name: Self-conspectus rebuild — snapshot, discard, reinitialize, read back
        run: node dev/test-rebuild-readback.mjs
      # Also from the repository root, and for the same reason: the store is
      # untracked, so what the rebuild covered is asserted over a committed
      # receipt here and over the live store wherever one exists.
      - name: Rebuild coverage — onboarding, batched subsystems, claims, cited edges
        run: node dev/test-rebuild-coverage.mjs
      # Third arm of the same rebuild: what P17 left at `structural`, carried to
      # `mapped` through the concern, adversarial and packaging phases. Same
      # reason it reads a committed receipt, and the same live-store arm.
      - name: Rebuild depth — concern dispositions, adversarial outcomes, seam assessment
        run: node dev/test-rebuild-depth.mjs
      # The last arm: what the rebuilt conspectus answers, and the projection
      # promoted out of it. `docs/` is tracked, so the byte-match runs here for
      # real; the three §12.4 assertions run against the committed receipt,
      # because the store they were made against is not.
      - name: Dogfood — the committed receipt, the attention fan-in, and the promoted docs/
        run: node dev/test-reader-lenses-dogfood.mjs
      # GATE D0 (design/survey-depth/spec.md §7.1) — survey depth against the
      # frozen baseline of §1.3. The store is untracked (`git ls-files
      # .amanuensis` → 0), so on a clean checkout the candidate arm is the
      # committed acceptance receipt; until the packet that runs the acceptance
      # rebuild writes one there is neither, and that state is exit 2 `cannot
      # run`, never green — an absence reported as an absence (VP4(e)).
      #
      # Which of the two answers this runner must see is decided by the tree,
      # not by the gate, so the step looks for the receipt itself and then
      # demands the matching answer. A `cannot run` accepted where a receipt is
      # committed would be the zero-denominator green this whole lane exists to
      # remove, and a green accepted where none is would be worse.
      - name: Survey depth — the blocking predicates against the frozen baseline
        run: |
          set +e
          out=$(node dev/test-survey-depth.mjs 2>&1); status=$?
          printf '%s\n' "$out"
          if [ -f design/survey-depth/acceptance-receipt.json ]; then
            test "$status" -eq 0 || { echo "the acceptance receipt is committed and the depth gate did not go green (exit $status)" >&2; exit 1; }
            printf '%s\n' "$out" | grep -q '^GATE P10 GREEN' || { echo "no green line" >&2; exit 1; }
            exit 0
          fi
          test "$status" -eq 2 || { echo "expected exit 2 (cannot run) with no store and no receipt, got $status" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P10 CANNOT RUN: ' || { echo "no cannot-run line" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P10 GREEN' && { echo "reported green with no candidate" >&2; exit 1; }
          exit 0
      # GATE D1 (design/survey-depth/spec.md §8.5) — the gate for the gate
      # above. It builds its own git workspaces and stores, seeds one fault at
      # a time into the rows D0 executes over, and requires D0 to turn red
      # naming the seeded predicate. It needs nothing this runner does not
      # already have; the one arm it cannot run here — regenerating the fixture
      # from the machine-local archive — reports itself unevaluated rather than
      # passing.
      - name: Survey depth red gates — the depth gate fires, and selectively
        run: node dev/test-survey-depth-red-gates.mjs
      # GATE CR1 (design/survey-depth/spec.md §8.9a) — the carry receipt against
      # the archive it summarises and the store the carry wrote into. Both of
      # its subjects are machine-local: the archive is an absolute path outside
      # the repository, and the live store is untracked (`git ls-files
      # .amanuensis` → 0). A bare runner has neither, which is exactly the state
      # that must not read as a pass, so this step asserts the third answer on
      # every run: exit 2 with a `cannot run` line, never green and never
      # offered as a red proof. Its selectivity arm — fifteen seeded faults over
      # the same comparison — needs no store and runs here regardless.
      #
      # To run the gate itself, set repository variable CR1_GATE_ENABLED=true
      # and CR1_ARCHIVE_STORE to a readable copy of the archived clean-slate
      # store on the runner, with a carried store at .amanuensis/memory.db.
      # Once enabled the job below is load-bearing.
      - name: Carry receipt reports cannot run, never green, with no archive
        env:
          AMANUENSIS_CARRY_ARCHIVE: ${{ runner.temp }}/no-such-archived-store.db
        run: |
          set +e
          out=$(node dev/test-carry-receipt.mjs 2>&1); status=$?
          printf '%s\n' "$out"
          test "$status" -eq 2 || { echo "expected exit 2 (cannot run), got $status" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P8 CANNOT RUN: ' || { echo "no cannot-run line" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P8 GREEN' && { echo "reported green with no archive" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P8 RED: ' && { echo "offered a cannot run as a red proof" >&2; exit 1; }
          exit 0
      # GATE A1 (design/survey-depth/spec.md §8.8) — the acceptance receipt,
      # recomputed. The receipt is the depth gate's candidate arm wherever the
      # live store is not, which on this runner is always, so a verdict field
      # read rather than recomputed would be a self-report validating itself.
      # This gate recomputes B1-B6 from the row-level witnesses §7.5 requires,
      # re-resolves every revision the receipt cites, and carries §8.8's control:
      # the committed receipt validates and two seeded forged-green copies of it
      # do not. It needs only committed files and the tree, so it is green here
      # or it is red here; the live-store arm narrows the window further wherever
      # a store exists, and its absence is never a pass.
      - name: Acceptance receipt — every blocking predicate recomputed, and two forged receipts refused
        run: node dev/test-survey-depth-acceptance.mjs
      - name: Carry receipt against the archived store and the carried store
        if: vars.CR1_GATE_ENABLED == 'true'
        env:
          AMANUENSIS_CARRY_ARCHIVE: ${{ vars.CR1_ARCHIVE_STORE }}
        run: |
          set -euo pipefail
          test -n "${AMANUENSIS_CARRY_ARCHIVE}" || {
            echo "CR1_GATE_ENABLED is true but CR1_ARCHIVE_STORE is unset." >&2
            echo "Provide the archive path or unset the variable; this gate does not skip silently." >&2
            exit 1
          }
          node dev/test-carry-receipt.mjs
      # The regeneration pass that closed slice-S6's F6, F7 and F9: the durable
      # challenge-outcome record and the `mapped` prerequisite over it, the
      # recorded status ladder, the registry crossings, and the project's
      # canonical name. Its first arm drives the real write path against a
      # throwaway store, so it runs from the repository root with mcp-server's
      # dependencies already installed by this job.
      - name: Regeneration — challenge outcomes, the recorded ladder, the registry edges, the project name
        run: node dev/test-rebuild-regeneration.mjs
      - name: Change impact — prediction, relation sensitivity, application
        working-directory: mcp-server
        run: node test-change-impact.mjs
      - name: Revalidation scheduler — custody, bounds, retries, reconciliation
        working-directory: mcp-server
        run: node test-revalidation-scheduler.mjs
      - name: Resolution proof — post-fix evidence and historical audit
        working-directory: mcp-server
        run: node test-resolution-proof.mjs
      - name: Projection custody — read-back recording and repair
        working-directory: mcp-server
        run: node test-projection-custody.mjs
      - name: Unattended refresh — authority, crash adoption, final read-back
        working-directory: mcp-server
        run: node test-refresh-recovery.mjs
      - name: Review brief — impact context, ablations, expansion, publication
        working-directory: mcp-server
        run: node test-review-brief.mjs
      - name: Independent review — blinding, fan-in, refutation, evaluation controls
        working-directory: mcp-server
        run: node test-review-analysis.mjs
      - name: Composition — exact fan-in and integral HEAD verification
        working-directory: mcp-server
        run: node test-composition.mjs
      - name: Review session — semantic states, expansion, and export read-back
        working-directory: mcp-server
        run: node test-review-session.mjs
      - name: CodebaseBrief — mode projections, omission custody, and contract red gates
        working-directory: mcp-server
        run: node test-codebase-brief.mjs
