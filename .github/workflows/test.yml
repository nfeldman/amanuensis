name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  roadmap:
    name: Roadmap structure and projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate roadmap and generated projection
        run: node dev/render-roadmap.mjs --check
      - name: Prove roadmap validation red gates
        run: node dev/test-roadmap.mjs
      - name: Verify Pecia execution custody matches the roadmap
        run: node dev/test-pecia-roadmap.mjs && node dev/test-pecia-roadmap-red-gates.mjs
      - name: Verify pinned living-conspectus baseline
        run: node dev/check-living-conspectus.mjs
      - name: Prove living-conspectus gates and clean-export read-back
        run: node dev/test-living-conspectus.mjs

  mcp-server:
    name: MCP server (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: mcp-server
        run: npm ci
      - name: Audit dependencies
        working-directory: mcp-server
        run: npm audit --audit-level=critical
      - name: Lint (Biome)
        working-directory: mcp-server
        run: npx biome check src/
      - name: Build
        working-directory: mcp-server
        run: npm run build
      - name: SQL identifiers resolve against schema
        working-directory: mcp-server
        run: node scripts/check-sql-identifiers.mjs
      - name: Tool inputSchemas are valid JSON Schema
        working-directory: mcp-server
        run: node scripts/check-tool-schemas.mjs
      - name: Smoke test (every tool)
        working-directory: mcp-server
        run: node test-smoke.mjs
      - name: Storage-dir git integration
        working-directory: mcp-server
        run: node test-storage-git.mjs
      - name: Cloud-mode storage (shared conspectus repo, nested-repo detection)
        working-directory: mcp-server
        run: node test-cloud-storage.mjs
      - name: Autoprogress infrastructure (open_questions + mode detection)
        working-directory: mcp-server
        run: node test-autoprogress.mjs
      - name: Conspectus comparison tool
        working-directory: mcp-server
        run: node test-compare.mjs
      - name: Subsystem priority (schema migration + ranking math)
        working-directory: mcp-server
        run: node test-priority.mjs
      - name: Cloud-harness end-to-end simulation
        working-directory: mcp-server
        run: node test-cloud-e2e.mjs
      - name: Installer CLI
        working-directory: mcp-server
        run: node test-installer.mjs
      - name: Adversarial — correctness
        working-directory: mcp-server
        run: node test-adversarial-correctness.mjs
      - name: Invariants — knowledge-depth gates + monotonic transitions
        working-directory: mcp-server
        run: node test-invariants.mjs
      - name: Temporal claims — intervals, supersession, migration, compatibility
        working-directory: mcp-server
        run: node test-temporal-claims.mjs
      - name: Change impact — prediction, relation sensitivity, application
        working-directory: mcp-server
        run: node test-change-impact.mjs
      - name: Revalidation scheduler — custody, bounds, retries, reconciliation
        working-directory: mcp-server
        run: node test-revalidation-scheduler.mjs
      - name: Resolution proof — post-fix evidence and historical audit
        working-directory: mcp-server
        run: node test-resolution-proof.mjs
      - name: Projection custody — read-back recording and repair
        working-directory: mcp-server
        run: node test-projection-custody.mjs
      - name: Unattended refresh — authority, crash adoption, final read-back
        working-directory: mcp-server
        run: node test-refresh-recovery.mjs
      - name: Review brief — impact context, ablations, expansion, publication
        working-directory: mcp-server
        run: node test-review-brief.mjs
      - name: Independent review — blinding, fan-in, refutation, evaluation controls
        working-directory: mcp-server
        run: node test-review-analysis.mjs
      - name: Composition — exact fan-in and integral HEAD verification
        working-directory: mcp-server
        run: node test-composition.mjs
      - name: Review session — semantic states, expansion, and export read-back
        working-directory: mcp-server
        run: node test-review-session.mjs
      - name: CodebaseBrief — mode projections, omission custody, and contract red gates
        working-directory: mcp-server
        run: node test-codebase-brief.mjs
      - name: Design sessions — independent lenses, disagreement, and underdetermination
        working-directory: mcp-server
        run: node test-design-session.mjs
      - name: Decisions — acceptance authority, impact custody, and projection read-back
        working-directory: mcp-server
        run: node test-decisions.mjs
      - name: Adversarial — security
        working-directory: mcp-server
        run: node test-adversarial-security.mjs
      - name: Performance ceilings (catastrophic-regression guard)
        working-directory: mcp-server
        run: node test-perf-ceilings.mjs
      - name: Tool inventory doc is up-to-date (DEVELOPMENT.md)
        working-directory: mcp-server
        run: node scripts/gen-tool-inventory.mjs --check

  materializer:
    name: Materializer (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        working-directory: materializer
        run: ruff check .
      - name: Diff-aware rendering test
        working-directory: materializer
        run: python3 test-materializer.py
      - name: Projection read-back fault injection
        working-directory: materializer
        run: python3 test-readback.py
