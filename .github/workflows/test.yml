name: tests

# This workflow covers what the product does and whether it packages. Gates over
# the self-conspectus, its receipts and the roadmap live in dev/ and run locally;
# they describe one store on one machine and say nothing about the product.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  mcp-server:
    name: MCP server (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Install
        working-directory: mcp-server
        run: npm ci
      - name: Audit dependencies
        working-directory: mcp-server
        run: npm audit --audit-level=critical
      - name: Lint (Biome)
        working-directory: mcp-server
        run: npx biome check src/
      - name: Build
        working-directory: mcp-server
        run: npm run build
      - name: SQL identifiers resolve against schema
        working-directory: mcp-server
        run: node scripts/check-sql-identifiers.mjs
      - name: Tool inputSchemas are valid JSON Schema
        working-directory: mcp-server
        run: node scripts/check-tool-schemas.mjs
      - name: MCP initialization, annotations, structured results, and error semantics
        working-directory: mcp-server
        run: node test-mcp-compatibility.mjs
      - name: Smoke test (every tool)
        working-directory: mcp-server
        run: node test-smoke.mjs
      - name: Storage-dir git integration
        working-directory: mcp-server
        run: node test-storage-git.mjs
      # GATE XS1 (design/survey-depth/spec.md §8.0a) runs the additive migration
      # on a copy of a real populated store. Its subject is machine-local and
      # private, so a bare runner cannot hold it — which is exactly the state
      # that must not read as a pass. The gate answers `cannot run` with exit 2
      # there, and this step asserts that third state on every run: a gate that
      # went green without its store would be the zero-denominator failure this
      # repository has recorded three times (B03-2, B04-1, B04-3).
      #
      # To run the gate itself, set repository variable XS1_GATE_ENABLED=true
      # and XS1_SOURCE_STORE to a readable copy of a populated store on the
      # runner. Once enabled the job below is load-bearing.
      - name: Existing-store migration reports cannot run, never green, with no store
        working-directory: mcp-server
        env:
          AMANUENSIS_XS1_SOURCE_STORE: ${{ runner.temp }}/no-such-amanuensis-store.db
        run: |
          set +e
          out=$(node test-existing-store-migration.mjs 2>&1); status=$?
          printf '%s\n' "$out"
          test "$status" -eq 2 || { echo "expected exit 2 (cannot run), got $status" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P0 CANNOT RUN: ' || { echo "no cannot-run line" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P0 GREEN' && { echo "reported green with no store" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '^GATE P0 RED: ' && { echo "offered a cannot run as a red proof" >&2; exit 1; }
          exit 0
      - name: Existing-store migration on a real populated store
        if: vars.XS1_GATE_ENABLED == 'true'
        working-directory: mcp-server
        env:
          AMANUENSIS_XS1_SOURCE_STORE: ${{ vars.XS1_SOURCE_STORE }}
        run: |
          set -euo pipefail
          test -n "${AMANUENSIS_XS1_SOURCE_STORE}" || {
            echo "XS1_GATE_ENABLED is true but XS1_SOURCE_STORE is unset." >&2
            echo "Provide the store path or unset the variable; this gate does not skip silently." >&2
            exit 1
          }
          node test-existing-store-migration.mjs
      - name: Cloud-mode storage (shared conspectus repo, nested-repo detection)
        working-directory: mcp-server
        run: node test-cloud-storage.mjs
      - name: Autoprogress infrastructure (open_questions + mode detection)
        working-directory: mcp-server
        run: node test-autoprogress.mjs
      - name: Conspectus comparison tool
        working-directory: mcp-server
        run: node test-compare.mjs
      - name: Subsystem priority (schema migration + ranking math)
        working-directory: mcp-server
        run: node test-priority.mjs
      - name: Cloud-harness end-to-end simulation
        working-directory: mcp-server
        run: node test-cloud-e2e.mjs
      - name: Installer CLI
        working-directory: mcp-server
        run: node test-installer.mjs
      - name: Codex user activation and wrong-workspace red gate
        working-directory: mcp-server
        run: node test-activation-contract.mjs
      - name: Activation doctor and digest-bound repair red gate
        working-directory: mcp-server
        run: node test-activation-doctor.mjs
      - name: Immutable repository binding and containment red gate
        working-directory: mcp-server
        run: node test-workspace-binding.mjs
      - name: Codex parent-process workspace selection
        working-directory: mcp-server
        run: node test-codex-parent-workspace.mjs
      - name: Codex app workspace handshake from filesystem root
        working-directory: mcp-server
        run: node test-codex-app-workspace.mjs
      - name: Nested Codex activation selects the Git root lazily
        working-directory: mcp-server
        run: node test-nested-activation-binding.mjs
      - name: Lazy first use leaves an untouched repository unchanged
        working-directory: mcp-server
        run: node test-first-use-laziness.mjs
      - name: First-use initialization recovers at every mutation boundary
        working-directory: mcp-server
        run: node test-first-use-recovery.mjs
      - name: Packed artifact adapters and MCP handshake
        working-directory: mcp-server
        run: node test-package-artifact.mjs
      - name: Source and clean-packed activation parity
        working-directory: mcp-server
        run: node test-package-activation-parity.mjs
      - name: Prove packed cwd and skill-version parity red gates
        run: node dev/test-package-activation-parity-red-gates.mjs
      - name: Exact-package rollback preserves five repository stores
        working-directory: mcp-server
        run: node test-release-rollback.mjs
      - name: Adversarial — correctness
        working-directory: mcp-server
        run: node test-adversarial-correctness.mjs
      - name: Invariants — knowledge-depth gates + monotonic transitions
        working-directory: mcp-server
        run: node test-invariants.mjs
      # GATE SD1 (design/survey-depth/spec.md §8.1). Its fixtures are a
      # temporary git workspace and a store it creates itself, so unlike GATE
      # XS1 above it needs nothing this runner does not already have.
      - name: Evidence-backed dispositions — set_disposition's inputs and the advance refusal
        working-directory: mcp-server
        run: node test-disposition-evidence.mjs
      # GATE SR1 (design/survey-depth/spec.md §8.2). Its fixtures are temporary
      # git workspaces and stores it creates itself; its one publishing arm
      # needs the materializer and a python3, which the projection gates above
      # already require of this runner.
      - name: Scope reconciliation — the record, the standing predicate, the two refusals
        working-directory: mcp-server
        run: node test-scope-reconciliation.mjs
      # GATE VD1 (design/survey-depth/spec.md §8.3). Its fixtures are temporary
      # git workspaces and stores it creates itself; one arm spawns the built
      # server over stdio to read tools/list, which the reader-lens gates above
      # already require of this runner.
      - name: Vocabulary discharge — anchors that resolve, and declining out loud
        working-directory: mcp-server
        run: node test-vocabulary-discharge.mjs
      # GATE EX9 (design/explanation/spec.md §3.1-§3.3). Its fixtures are temporary
      # git workspaces and stores it creates itself; one arm spawns the built
      # server over stdio to read tools/list, as the gate above does.
      - name: Explanation record — the two writers, the effective row, the byte caps
        working-directory: mcp-server
        run: node test-explanations.mjs
      # GATE EX15 (design/explanation/spec.md §3.1 Reset, §3.3). Seeds fixtures
      # through the built handlers and reads them back through the built server
      # over stdio; it digests the store around the reads.
      - name: Explanation read — get_explanations and the reset that withdraws
        working-directory: mcp-server
        run: node test-explanation-read.mjs
      # GATE EX10 (design/explanation/spec.md §3.4, §3.5). Drives both status writers
      # through the built handlers over temporary git workspaces, and reads the
      # register and the skill text the refusal sends a caller to.
      - name: Explanation gate — the advance to mapped and the authoring instructions
        working-directory: mcp-server
        run: node test-explanation-gate.mjs
      # GATE CF1 (design/survey-depth/spec.md §8.4). Its fixtures are temporary
      # git workspaces, stores and archives it creates itself — the frozen
      # clean-slate archive is deliberately not read here, because a gate whose
      # red proof needs a machine-local file cannot be proved on a clean
      # checkout (§8.0 clause 3). Some arms drive the rebuild driver and the
      # built server over stdio, both of which the gates above already require.
      - name: Carried findings — the carry, its counts, and the three authority rules
        working-directory: mcp-server
        run: node test-carried-findings.mjs
      - name: Derived staleness — ledger drift and scope reconciliation
        working-directory: mcp-server
        run: node test-derived-staleness.mjs
      - name: Startup bounds — no unbounded probe on the activation path
        working-directory: mcp-server
        run: node test-startup-bounds.mjs
      - name: Generated enum modules match the vocabulary source
        working-directory: mcp-server
        run: node scripts/gen-vocabulary.mjs --check
      - name: SQL CHECK literals match the vocabulary source
        working-directory: mcp-server
        run: node scripts/gen-vocabulary.mjs --check-sql
      - name: Evidence vocabulary — the source, both generated files, and SKILL.md agree
        working-directory: mcp-server
        run: node scripts/check-evidence-vocabulary.mjs
      # design/survey-depth/spec.md §8.10. The calibrated concern checklist and
      # the finding-id convention used to be literals inside
      # dev/test-rebuild-depth.mjs, which counts a survey's concern coverage
      # against them; a denominator read out of the document that reports the
      # coverage lets a dropped concern shrink both halves at once. They live in
      # a standalone contract no rebuild packet rewrites, and this is what keeps
      # that contract from becoming a literal with a longer path. Its document
      # arm needs nothing but the repository; its calibration arm reports itself
      # unrun where no store exists rather than passing silently.
      - name: Concern checklist — the calibrated codes, the territories, the finding-id convention
        working-directory: mcp-server
        run: node scripts/check-concern-checklist.mjs
      # design/survey-depth/spec.md §6.2. The same shape as the check above and
      # for the same reason: a fact published in two places needs something that
      # compares them. Here the two places are the server's refusal messages and
      # the skill references that instruct the calls those refusals now stop.
      # Its third and fourth assertions derive the candidate set from the
      # server's own messages, so a refusal nobody registered is reported rather
      # than passed over in silence (§8.7).
      - name: Refusal parity — the register, the server's own words, and every caller
        working-directory: mcp-server
        run: node scripts/check-refusal-parity.mjs
      # GATE RP1 (design/survey-depth/spec.md §8.7). It builds its own fixture
      # parity tree and sabotages it one edit at a time, so it needs nothing this
      # runner does not already have.
      - name: Refusal parity red gates — the check fires, and names what drifted
        working-directory: mcp-server
        run: node test-refusal-parity.mjs
      - name: Single enum source — generated files, SQL CHECKs, validators, hint tables
        working-directory: mcp-server
        run: node test-vocabulary-source.mjs
      - name: Finding partition — one state view, five readers, one page per finding
        working-directory: mcp-server
        run: node test-finding-partition.mjs
      - name: Locus standing — the file_standing view, kind inference, reachability
        working-directory: mcp-server
        run: node test-locus-index-view.mjs
      - name: describe_locus — the account, its contract, and read-only annotations
        working-directory: mcp-server
        run: node test-locus-standing.mjs
      - name: Locus compactness — wire budgets and the omission ledger
        working-directory: mcp-server
        run: node test-locus-compactness.mjs
      - name: Residual hardening — revision-bound writers, one open-finding predicate
        working-directory: mcp-server
        run: node test-residual-hardening.mjs
      - name: Temporal claims — intervals, supersession, migration, compatibility
        working-directory: mcp-server
        run: node test-temporal-claims.mjs
      - name: Structural claims — add_claim's substrate checks and the narrative fallback
        working-directory: mcp-server
        run: node test-structural-claims.mjs
      - name: Phase 2 claims — the claim_key prerequisite on 'structural'
        working-directory: mcp-server
        run: node test-phase2-claims-gate.mjs
      - name: Cited edges — add_xref's citation contract and topology from recorded rows
        working-directory: mcp-server
        run: node test-edge-contract.mjs
      - name: Attention and history — operational labels, census reconciliation, budgets
        working-directory: mcp-server
        run: node test-attention-history.mjs
      - name: Consumer route — instructions, annotations, inventory, skill route, installer
        working-directory: mcp-server
        run: node test-consumer-route.mjs
      - name: Change impact — prediction, relation sensitivity, application
        working-directory: mcp-server
        run: node test-change-impact.mjs
      - name: Revalidation scheduler — custody, bounds, retries, reconciliation
        working-directory: mcp-server
        run: node test-revalidation-scheduler.mjs
      - name: Resolution proof — post-fix evidence and historical audit
        working-directory: mcp-server
        run: node test-resolution-proof.mjs
      - name: Projection custody — read-back recording and repair
        working-directory: mcp-server
        run: node test-projection-custody.mjs
      - name: Unattended refresh — authority, crash adoption, final read-back
        working-directory: mcp-server
        run: node test-refresh-recovery.mjs
      - name: Review brief — impact context, ablations, expansion, publication
        working-directory: mcp-server
        run: node test-review-brief.mjs
      - name: Independent review — blinding, fan-in, refutation, evaluation controls
        working-directory: mcp-server
        run: node test-review-analysis.mjs
      - name: Composition — exact fan-in and integral HEAD verification
        working-directory: mcp-server
        run: node test-composition.mjs
      - name: Review session — semantic states, expansion, and export read-back
        working-directory: mcp-server
        run: node test-review-session.mjs
      - name: CodebaseBrief — mode projections, omission custody, and contract red gates
        working-directory: mcp-server
        run: node test-codebase-brief.mjs
      - name: Design sessions — independent lenses, disagreement, and underdetermination
        working-directory: mcp-server
        run: node test-design-session.mjs
      - name: Decisions — acceptance authority, impact custody, and projection read-back
        working-directory: mcp-server
        run: node test-decisions.mjs
      - name: Research broker — admission, Scholiast custody, and external/code separation
        working-directory: mcp-server
        run: node test-research-broker.mjs
      - name: Crosswalk — identity gates, counterevidence, and Collatio qualification adapter
        working-directory: mcp-server
        run: node test-crosswalk-qualification.mjs
      - name: Learning ledger — typed channels, scored promotion, and runtime read-back
        working-directory: mcp-server
        run: node test-learning-ledger.mjs
      - name: Operating envelope — stratified controls, instrument clearance, and no pooling
        working-directory: mcp-server
        run: node test-operating-envelope.mjs
      - name: Chorusmith adapter — contracts, direct parity, bypass, and recovery
        working-directory: mcp-server
        run: node test-chorusmith-adapter.mjs
      - name: Historical evaluation — clean packets, kill witnesses, and leakage guards
        working-directory: mcp-server
        run: node test-historical-evaluation.mjs
      - name: Adversarial — security
        working-directory: mcp-server
        run: node test-adversarial-security.mjs
      - name: Performance ceilings (catastrophic-regression guard)
        working-directory: mcp-server
        run: node test-perf-ceilings.mjs
      - name: Tool inventory doc is up-to-date (DEVELOPMENT.md)
        working-directory: mcp-server
        run: node scripts/gen-tool-inventory.mjs --check

  materializer:
    name: Materializer (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        working-directory: materializer
        run: ruff check .
      - name: Diff-aware rendering test
        working-directory: materializer
        run: python3 test-materializer.py
      - name: Projection read-back fault injection
        working-directory: materializer
        run: python3 test-readback.py
      - name: Overview truthfulness — thesis by heading and the orientation lint
        working-directory: materializer
        run: python3 test-overview-truthfulness.py
      - name: Ledger-derived freshness and the stale read-back axis
        working-directory: materializer
        run: python3 test-ledger-freshness.py
      - name: Page plan, navigation groups, Files, and Not yet surveyed
        working-directory: materializer
        run: python3 test-lens-pages.py
      - name: Prose retention — every model-authored field reaches a page
        working-directory: materializer
        run: python3 test-prose-retention.py
      - name: Claim register — statement first, grouped by recorded segment
        working-directory: materializer
        run: python3 test-claim-register.py
      - name: Survey narrative placement — inside Structure when claims exist
        working-directory: materializer
        run: python3 test-narrative-placement.py
      - name: Subsystem page leads with Purpose and How it works
        working-directory: materializer
        run: python3 test-explanation-pages.py
      - name: Purposes and the project account elsewhere on the pages
        working-directory: materializer
        run: python3 test-explanation-orientation.py
      - name: File ledger groups rows that share a reason
        working-directory: materializer
        run: python3 test-ledger-grouping.py
      - name: Unfilled-slot census and the skill text that feeds it
        working-directory: materializer
        run: python3 test-placeholder-census.py
      - name: Unresolved and History pages, the resolution basis, and the reader's guide
        working-directory: materializer
        run: python3 test-history-and-disagreements.py
      - name: Locus search index, read-back custody, and the accessible search
        working-directory: materializer
        run: python3 test-search-index.py
      - name: Unmeasured coverage — the projection renders 'not measured'
        working-directory: materializer
        run: python3 test-unmeasured-coverage.py

  node-compatibility:
    name: Node ${{ matrix.node-version }} package floor
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install
        working-directory: mcp-server
        run: npm ci
      - name: Build
        working-directory: mcp-server
        run: npm run build
      - name: Protocol compatibility
        working-directory: mcp-server
        run: node test-mcp-compatibility.mjs
