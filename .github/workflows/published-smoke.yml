name: published smoke

# Validates the @gruetech/amanuensis npm tarball end-to-end on a clean
# machine. The in-tree `tests` workflow runs against the source tree;
# this one runs against the *published* artifact, which catches a
# different class of bug:
#
# - missing files in the npm tarball (the `files` allowlist drops
#   something the runtime needs)
# - prepack bundling failed silently (the skill or materializer was not copied
#   into the package)
# - bin shims on PATH don't resolve correctly post-install
# - native dependencies (better-sqlite3) don't build on a fresh OS
# - the published version is broken in a way the source tree isn't
#
# Triggered manually after a publish; not on push, because there's
# nothing to validate until something is on npm.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version or dist-tag to install (e.g. latest, 0.2.0-alpha.0)"
        required: false
        default: "latest"

jobs:
  smoke:
    name: install + smoke (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Configure isolated Codex home
        shell: bash
        run: echo "CODEX_HOME=$RUNNER_TEMP/a24-codex-home" >> "$GITHUB_ENV"

      - name: Install @gruetech/amanuensis from npm
        run: npm install -g "@gruetech/amanuensis@${{ inputs.version }}"

      - name: Bin entries are on PATH
        shell: bash
        run: |
          set -euo pipefail
          which amanuensis
          which amanuensis-memory

      - name: amanuensis --help
        run: amanuensis --help

      - name: User-scoped Codex install is repository-independent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME" "$RUNNER_TEMP/a24-repository-a" "$RUNNER_TEMP/a24-repository-b"
          git -C "$RUNNER_TEMP/a24-repository-a" init --quiet
          git -C "$RUNNER_TEMP/a24-repository-b" init --quiet
          printf '# unrelated published-smoke bytes\n[features]\nkeep = true\n' > "$CODEX_HOME/config.toml"
          amanuensis install --dir "$RUNNER_TEMP/a24-repository-a"
          test ! -e "$RUNNER_TEMP/a24-repository-a/.codex"
          test ! -e "$RUNNER_TEMP/a24-repository-a/.amanuensis"
          test ! -e "$RUNNER_TEMP/a24-repository-b/.codex"
          test ! -e "$RUNNER_TEMP/a24-repository-b/.amanuensis"
          amanuensis doctor --client codex --dir "$RUNNER_TEMP/a24-repository-a" --json
          amanuensis doctor --client codex --dir "$RUNNER_TEMP/a24-repository-b" --json
          amanuensis upgrade --dir "$RUNNER_TEMP/a24-repository-a" --dry-run
          amanuensis upgrade --dir "$RUNNER_TEMP/a24-repository-a"

      - name: amanuensis init writes every client adapter
        shell: bash
        run: |
          set -euo pipefail
          for client in claude codex vscode generic; do
            ws="$RUNNER_TEMP/smoke-$client"
            mkdir -p "$ws"
            if [[ "$client" == codex ]]; then
              amanuensis init --client codex --scope project --dir "$ws"
            else
              amanuensis init --client "$client" --dir "$ws"
            fi
          done
          test -f "$RUNNER_TEMP/smoke-claude/.claude/skills/amanuensis/SKILL.md"
          test -f "$RUNNER_TEMP/smoke-claude/.mcp.json"
          test -f "$RUNNER_TEMP/smoke-codex/.agents/skills/amanuensis/SKILL.md"
          test -f "$RUNNER_TEMP/smoke-codex/.codex/config.toml"
          test -f "$RUNNER_TEMP/smoke-vscode/.agents/skills/amanuensis/SKILL.md"
          test -f "$RUNNER_TEMP/smoke-vscode/.vscode/mcp.json"
          test -f "$RUNNER_TEMP/smoke-generic/.agents/skills/amanuensis/SKILL.md"
          test ! -e "$RUNNER_TEMP/smoke-generic/.mcp.json"

      - name: amanuensis init --dry-run is repeatable on an installed workspace
        shell: bash
        run: |
          set -euo pipefail
          amanuensis init --client claude --dir "$RUNNER_TEMP/smoke-claude" --dry-run

      - name: Two fresh repositories bind lazily and independently
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/handshake.mjs" <<'EOF'
          // Minimal MCP client for the published artifact: startup and
          // get_project_info must be read-only, then one DB-backed query must
          // create exactly the cwd-bound repository store.
          import { spawn } from "node:child_process";
          import { existsSync, realpathSync } from "node:fs";
          import { join } from "node:path";

          async function probe(ws) {
            const proc = spawn("amanuensis-memory", [], { cwd: ws, stdio: ["pipe", "pipe", "inherit"] });
            let buf = "";
            let nextId = 1;
            const pending = new Map();
            proc.stdout.on("data", (chunk) => {
              buf += chunk.toString("utf8");
              let nl;
              while ((nl = buf.indexOf("\n")) >= 0) {
                const line = buf.slice(0, nl).trim();
                buf = buf.slice(nl + 1);
                if (!line) continue;
                const msg = JSON.parse(line);
                const waiter = pending.get(msg.id);
                if (waiter) {
                  pending.delete(msg.id);
                  if (msg.error) waiter.reject(new Error(JSON.stringify(msg.error)));
                  else waiter.resolve(msg.result);
                }
              }
            });
            const request = (method, params = {}) => {
              const id = nextId++;
              const result = new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error("timeout: " + method)), 15000);
                pending.set(id, {
                  resolve(value) { clearTimeout(timer); resolve(value); },
                  reject(error) { clearTimeout(timer); reject(error); },
                });
              });
              proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", id, method, params }) + "\n");
              return result;
            };
            try {
              await request("initialize", {
                protocolVersion: "2025-06-18",
                capabilities: {},
                clientInfo: { name: "published-smoke", version: "1" },
              });
              proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized", params: {} }) + "\n");
              await request("tools/list");
              const before = await request("tools/call", { name: "get_project_info", arguments: {} });
              if (before.structuredContent.db_exists || existsSync(join(ws, ".amanuensis"))) {
                throw new Error("published server wrote before first DB-backed use");
              }
              await request("tools/call", { name: "get_session", arguments: {} });
              const after = await request("tools/call", { name: "get_project_info", arguments: {} });
              if (after.structuredContent.binding_receipt.canonicalRoot !== realpathSync(ws)) {
                throw new Error("published server bound the wrong repository");
              }
              if (after.structuredContent.storage_path !== join(realpathSync(ws), ".amanuensis")) {
                throw new Error("published server selected the wrong storage");
              }
              if (!after.structuredContent.db_exists) throw new Error("first use did not initialize DB");
            } finally {
              proc.kill("SIGTERM");
            }
          }

          const repositories = process.argv.slice(2);
          try {
            for (const repository of repositories) await probe(repository);
            console.log("published activation bound " + repositories.length + "/" + repositories.length + " repositories");
          } catch (error) {
            console.error("smoke failed:", error.message);
            process.exitCode = 1;
          }
          EOF
          node "$RUNNER_TEMP/handshake.mjs" "$RUNNER_TEMP/a24-repository-a" "$RUNNER_TEMP/a24-repository-b"

      - name: Uninstall preserves both repository stores and unrelated config
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/a24-repository-a/.amanuensis/memory.db"
          test -f "$RUNNER_TEMP/a24-repository-b/.amanuensis/memory.db"
          amanuensis uninstall --client codex --scope user --dir "$RUNNER_TEMP/a24-repository-a" --dry-run
          amanuensis uninstall --client codex --scope user --dir "$RUNNER_TEMP/a24-repository-a"
          grep -F '# unrelated published-smoke bytes' "$CODEX_HOME/config.toml"
          test -f "$RUNNER_TEMP/a24-repository-a/.amanuensis/memory.db"
          test -f "$RUNNER_TEMP/a24-repository-b/.amanuensis/memory.db"
          test ! -e "$CODEX_HOME/skills/amanuensis"
