<section class="section-seam-sides-no-one-has-assessed">
<h2 id="seam-sides-no-one-has-assessed"><a class="heading-anchor" href="#seam-sides-no-one-has-assessed" aria-label="Link to Seam sides no one has assessed">§</a>Seam sides no one has assessed</h2>
<p><strong>2 of 2</strong> (seam, side) pairs carry no recorded assessment. The unit is the pair, not the seam: a seam assessed from one side only is half-known, and counting seams would report it as covered.</p>
<p>Binding: per-party-proxy; no seam-bound disposition is recorded. An <code>SC-%</code> disposition says a party has assessed some seam concern, never that it assessed this seam.</p>
