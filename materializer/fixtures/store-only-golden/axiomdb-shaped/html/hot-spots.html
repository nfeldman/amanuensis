<section class="section-what-each-column-measures">
<h2 id="what-each-column-measures"><a class="heading-anchor" href="#what-each-column-measures" aria-label="Link to What each column measures">§</a>What each column measures</h2>
<div class="prose-flow"><p><strong>Open critical + high</strong> and <strong>Open medium + low</strong> are kept apart because severity is an ordinal ramp of consequence and adding the two ends of it together would let four readability defects outweigh one data-loss path.</p><p><strong>Awaiting verification</strong> counts repairs recorded against a commit with no evidence yet that they hold. It is not progress and it is not an open defect; it is a claim nobody has checked.</p><p><strong>Undiscriminated</strong> counts unresolved contradictions, open and unresolved-competition matrices, and concern reviews that recorded a competition. A contradiction between findings in two subsystems is counted in both, because it is undiscriminated territory in both.</p><p><strong>Weakest evidence quality</strong> is the weakest rung any <span class="status status-disposition status-confirmed-bug" title="A defect supported by evidence and retained after adversarial review.">Confirmed defect</span> review here rests on, not an average: the weakest link is what a reader should re-verify first.</p><p><strong>Unread files</strong> and <strong>Stale files</strong> are counted over ledger rows that carry a survey obligation; generated, vendored, and irrelevant paths are outside the denominator.</p><p><strong>Unassessed seam sides</strong> counts <code>(seam, side)</code> pairs over twice the seams this subsystem is party to: a seam assessed from one side only is half-known, and counting seams would report it as covered. Binding: per-party-proxy; no seam-bound disposition is recorded. An <code>SC-%</code> disposition says a party has assessed some seam concern, never that it assessed this seam.</p><p>No <strong>Access heat</strong> column is shown: no recorded access reaches a subsystem, and a column of zeros would read as a measurement that was taken.</p></div>
</section></article>
