<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>code-verified</code></td><td data-label="Label">Code verified</td><td data-label="What it means">The implementation was read and the stated behavior was verified directly.</td><td data-label="What it cannot justify">behavior at any revision other than the one cited</td></tr><tr><td data-label="Value"><code>runtime-observed</code></td><td data-label="Label">Runtime observed</td><td data-label="What it means">The behavior was observed in a running system and the observation was recorded.</td><td data-label="What it cannot justify">that the same behavior holds under other inputs or configurations</td></tr><tr><td data-label="Value"><code>contract-stated</code></td><td data-label="Label">Contract stated</td><td data-label="What it means">An explicit schema, type, or behavioral contract states this claim.</td><td data-label="What it cannot justify">that the implementation honors the contract</td></tr><tr><td data-label="Value"><code>test-observed</code></td><td data-label="Label">Test observed</td><td data-label="What it means">A test run or recorded observation demonstrates this behavior.</td><td data-label="What it cannot justify">behavior outside what the test exercises</td></tr><tr><td data-label="Value"><code>config-asserted</code></td><td data-label="Label">Config asserted</td><td data-label="What it means">Configuration states the behavior, but runtime behavior was not independently verified.</td><td data-label="What it cannot justify">that this configuration is the one in effect</td></tr><tr><td data-label="Value"><code>doc-asserted</code></td><td data-label="Label">Docs asserted</td><td data-label="What it means">Project documentation states the claim; implementation agreement is not yet verified.</td><td data-label="What it cannot justify">that the implementation matches the documentation</td></tr><tr><td data-label="Value"><code>comment-asserted</code></td><td data-label="Label">Comment asserted</td><td data-label="What it means">A code comment states the claim; the implementation was not verified against it.</td><td data-label="What it cannot justify">that the comment is current with the code beside it</td></tr><tr><td data-label="Value"><code>name-inferred</code></td><td data-label="Label">Name inferred</td><td data-label="What it means">The claim is inferred from a symbol name and should be treated as weak evidence.</td><td data-label="What it cannot justify">any correctness claim; a name is not an implementation</td></tr><tr><td data-label="Value"><code>pattern-matched</code></td><td data-label="Label">Pattern matched</td><td data-label="What it means">The claim matches a known pattern and is only a scoping signal.</td><td data-label="What it cannot justify">any claim about what this locus actually does</td></tr></tbody></table></div>

sion was carried out</td></tr></tbody></table></div>

<h3 id="attention-label"><a class="heading-anchor" href="#attention-label" aria-label="Link to Attention label">§</a>Attention label</h3>

xed-pending-verification.</td><td data-label="What it cannot justify">that the defect is gone at the repository head</td></tr><tr><td data-label="Value"><code>undiscriminated</code></td><td data-label="Label">Undiscriminated</td><td data-label="What it means">Two or more credible accounts stand and the record does not say which of them the evidence picks out.</td><td data-label="What it cannot justify">any one of the competing accounts</td></tr></tbody></table></div>
<h3 id="narrative-section"><a class="heading-anchor" href="#narrative-section" aria-label="Link to Narrative section">§</a>Narrative section</h3>

<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>structure</code></td><td data-label="Label">Structure</td><td data-label="What it means">How the subsystem is built: its parts, what it holds, and how work moves through it.</td><td data-label="What it cannot justify">that the structure is correct; it says how the subsystem is built as read at one revision, not that it works</td></tr><tr><td data-label="Value"><code>concern-reasoning</code></td><td data-label="Label">Concern reasoning</td><td data-label="What it means">Why each concern was judged to apply, to be acceptable, or to be a bug.</td><td data-label="What it cannot justify">that no other concern applies; it gives the reasons for the verdicts the session reached</td></tr><tr><td data-label="Value"><code>challenge</code></td><td data-label="Label">Challenge</td><td data-label="What it means">What was tried to disprove the subsystem's findings, and what held.</td><td data-label="What it cannot justify">that a finding is true; it says only what the challenge attempted and found</td></tr><tr><td data-label="Value"><code>repository-shape</code></td><td data-label="Label">Repository shape</td><td data-label="What it means">How the repository is laid out and where its parts meet.</td><td data-label="What it cannot justify">that every directory is accounted for; it describes the layout the survey read</td></tr><tr><td data-label="Value"><code>runtime</code></td><td data-label="Label">Runtime</td><td data-label="What it means">What runs, in which language or process, and how the parts call each other.</td><td data-label="What it cannot justify">that the system behaves this way in production; it describes the code as read</td></tr><tr><td data-label="Value"><code>stateful-entities</code></td><td data-label="Label">Stateful entities</td><td data-label="What it means">What the system stores or remembers between calls, and what may change it.</td><td data-label="What it cannot justify">that the list is complete; it names the state the survey found</td></tr><tr><td data-label="Value"><code>concern-calibration</code></td><td data-label="Label">Concern calibration</td><td data-label="What it means">Which kinds of concern apply to this project and which do not, and why.</td><td data-label="What it cannot justify">that a concern ruled out here cannot occur; it says the survey did not look for it</td></tr><tr><td data-label="Value"><code>start-here</code></td><td data-label="Label">Start here</td><td data-label="What it means">Where a new reader should begin, and in what order to read on.</td><td data-label="What it cannot justify">that the rest of the survey can be skipped; it is a route into the record, not a summary of it</td></tr><tr><td data-label="Value"><code>survey-plan</code></td><td data-label="Label">Survey plan</td><td data-label="What it means">What the survey means to read next, and in what order.</td><td data-label="What it cannot justify">that any of it has been read; a plan is not a reading</td></tr></tbody></table></div>

<h3 id="claim-mark-kind"><a class="heading-anchor" href="#claim-mark-kind" aria-label="Link to Claim mark kind">§</a>Claim mark kind</h3>

<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>commit-point</code></td><td data-label="Label">Commit point</td><td data-label="What it means">The step after which the flow's effect is kept even if a later step fails.</td><td data-label="What it cannot justify">that every failure after it is harmless; it says only where the effect becomes durable</td></tr><tr><td data-label="Value"><code>crash-point</code></td><td data-label="Label">Crash point</td><td data-label="What it means">A step where the process can stop partway; the label says what is left half done.</td><td data-label="What it cannot justify">that the flow recovers from the stop; it says only that the stop leaves the state named</td></tr><tr><td data-label="Value"><code>exit</code></td><td data-label="Label">Exit</td><td data-label="What it means">A way the flow stops before its last step; the label says why and the target says where it unwinds to, or that it leaves the flow.</td><td data-label="What it cannot justify">that the exit is handled by the caller; it says only where the flow ends up</td></tr><tr><td data-label="Value"><code>crosses-seam</code></td><td data-label="Label">Crosses a seam</td><td data-label="What it means">A step where work passes over a named system boundary.</td><td data-label="What it cannot justify">that the other side behaves as the step expects; it says only that the call crosses</td></tr><tr><td data-label="Value"><code>trigger</code></td><td data-label="Label">Trigger</td><td data-label="What it means">What starts the flow. It belongs to the flow's first step.</td><td data-label="What it cannot justify">that nothing else can start the flow; it names the start the survey found</td></tr></tbody></table></div>
