      <article class="content content-guide"><section class="section-what-this-site-is">
<h2 id="what-this-site-is"><a class="heading-anchor" href="#what-this-site-is" aria-label="Link to What this site is">§</a>What this site is</h2>
<p>This site is the record of an AI agent's survey of Scribe. The agent read the code, recorded what it concluded and the code each conclusion rests on, and listed what it could not settle. It does not change the code. Every page is as of one commit, shown at the top of each HTML page as <em>Checked</em> and in the overview's <em>Checked at</em> row.</p>
<p>Each page is HTML, written to one directory that starts at index.html. The diagrams, the search and the definitions shown on hover need nothing outside that directory, so a copy of the whole directory reads the same.</p>
</section>

<section class="section-how-a-survey-works">
<h2 id="how-a-survey-works"><a class="heading-anchor" href="#how-a-survey-works" aria-label="Link to How a survey works">§</a>How a survey works</h2>
<p>The agent works in two stages and does not wait for approval between steps.</p>
<p><strong>Onboarding</strong>, once. The agent reads the repository's shape, splits it into subsystems grouped by layer, writes a review checklist of defects worth looking for in this codebase, ranks the subsystems, and publishes the first version of this site.</p>
<p><strong>A survey of each subsystem</strong>, highest priority first, in five passes:</p>
<div class="table-wrap"><table><caption>how a survey works</caption><thead><tr><th scope="col">Pass</th><th scope="col">What the agent does</th><th scope="col">Survey depth it sets, and when</th><th scope="col">What that depth means</th></tr></thead><tbody><tr><td data-label="Pass">Scope</td><td data-label="What the agent does">Lists the subsystem's files and the terms it uses.</td><td data-label="Survey depth it sets, and when"><strong>Scoped</strong>, when the pass is done</td><td data-label="What that depth means">The scope pass is done: the subsystem's boundary and files are established, nothing more.</td></tr><tr><td data-label="Pass">Structure</td><td data-label="What the agent does">Reads the files; records types, state, data flows, concurrency, and claims.</td><td data-label="Survey depth it sets, and when"><strong>Structural</strong>, when the pass is done</td><td data-label="What that depth means">The structure pass is done: types, state, flows and concurrency are mapped; correctness claims are not yet authorized.</td></tr><tr><td data-label="Pass">Concern review</td><td data-label="What the agent does">Gives every checklist item a verdict with evidence. Confirmed defects become findings.</td><td data-label="Survey depth it sets, and when"><strong>Reviewing concerns</strong>, as the pass starts</td><td data-label="What that depth means">Structural mapping is complete and concern-by-concern review is in progress.</td></tr><tr><td data-label="Pass">Challenge</td><td data-label="What the agent does">Tries to prove each claim and finding wrong.</td><td data-label="Survey depth it sets, and when"><strong>Challenging claims</strong>, as the pass starts</td><td data-label="What that depth means">Candidate conclusions are being challenged; treat them as provisional.</td></tr><tr><td data-label="Pass">Packaging</td><td data-label="What the agent does">Writes the subsystem's purpose and account, updates the site.</td><td data-label="Survey depth it sets, and when"><strong>Mapped</strong>, when the pass is done</td><td data-label="What that depth means">Survey complete through structural analysis, concern review, and adversarial challenge.</td></tr></tbody></table></div>
<p>A subsystem shown as <em>Reviewing concerns</em> or <em>Challenging claims</em> is in the middle of that pass: its verdicts and findings so far are not the last word.</p>
