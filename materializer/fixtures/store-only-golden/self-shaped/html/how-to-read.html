"62.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="312" y="62.7">Structure</tspan></text><text x="312" y="77.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="312" y="77.3">Pass 2</tspan></text></a></g><g data-node="status-check:structural"><a href="#survey-workflow-pass-2"><rect x="249" y="137" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="312" y="159.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="312" y="159.2">Server checks</tspan></text><text x="312" y="174.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="312" y="174.3">3 checks for</tspan><tspan x="312" y="188.3">Structural</tspan></text></a></g><g data-node="survey-pass:3"><a href="#survey-workflow-pass-3"><rect x="393" y="33" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="456" y="62.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="456" y="62.7">Concern review</tspan></text><text x="456" y="77.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="456" y="77.3">Pass 3</tspan></text></a></g><g data-node="status-check:concerns"><a href="#survey-workflow-pass-3"><rect x="393" y="137" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="456" y="159.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="456" y="159.2">Server checks</tspan></text><text x="456" y="174.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="456" y="174.3">2 checks for</tspan><tspan x="456" y="188.3">Reviewing concerns</tspan></text></a></g><g data-node="survey-pass:4"><a href="#survey-workflow-pass-4"><rect x="537" y="33" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="600" y="62.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="600" y="62.7">Challenge</tspan></text><text x="600" y="77.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="600" y="77.3">Pass 4</tspan></text></a></g><g data-node="status-check:adversarial"><a href="#survey-workflow-pass-4"><rect x="537" y="137" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="600" y="159.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="600" y="159.2">Server checks</tspan></text><text x="600" y="174.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="600" y="174.3">2 checks for</tspan><tspan x="600" y="188.3">Challenging claims</tspan></text></a></g><g data-node="survey-pass:5"><a href="#survey-workflow-pass-5"><rect x="681" y="33" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="744" y="62.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="744" y="62.7">Packaging</tspan></text><text x="744" y="77.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="744" y="77.3">Pass 5</tspan></text></a></g><g data-node="status-check:mapped"><a href="#survey-workflow-pass-5"><rect x="681" y="137" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="744" y="166.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="744" y="166.7">Server checks</tspan></text><text x="744" y="181.3" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="744" y="181.3">4 checks for Mapped</tspan></text></a></g><g data-node="checkpoint:mapped"><a href="#survey-workflow-checkpoint-5"><rect x="825" y="241" width="126" height="66" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="888" y="270.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="888" y="270.7">Your checkpoint</tspan></text><text x="888" y="285.4" text-anchor="middle" font-family="var(--heading)" font-size="11" font-weight="400" fill="var(--text-muted)"><tspan x="888" y="285.4">Summary in your chat</tspan></text></a></g></svg></div><div class="diagram-account"><p>The agent does each pass in order and does not wait for approval between them. The server answers only when a depth is set: it refuses the move unless the checks below it hold. You are told at the checkpoints; the site itself is read-only.</p><p>1 of 5 passes has no server check (Scope). 1 of 5 pass tells you something when it is done.</p><ol class="diagram-items"><li id="survey-workflow-pass-1">Scope (pass 1). Lists the subsystem's files and the terms it uses. It sets Scoped when the pass is done. The server checks nothing before it.</li><li id="survey-workflow-pass-2">Structure (pass 2). Reads the files; records types, state, data flows, concurrency, and claims. It sets Structural when the pass is done. The server checks: The file ledger lists at least one file; At least one current structural claim is recorded for the subsystem; A term the scope pass found is defined, or its definition is declined with a reason.</li><li id="survey-workflow-pass-3">Concern review (pass 3). Gives every checklist item a verdict with evidence. Confirmed defects become findings. It sets Reviewing concerns as the pass starts. The server checks: A structure narrative is recorded or declined, or an imported survey body is kept; Every concern disposition the subsystem holds has evidence attached whose revision resolves.</li><li id="survey-workflow-pass-4">Challenge (pass 4). Tries to prove each claim and finding wrong. It sets Challenging claims as the pass starts. The server checks: At least one concern disposition is recorded; Every concern disposition the subsystem holds has evidence attached whose revision resolves.</li><li id="survey-workflow-pass-5">Packaging (pass 5). Writes the subsystem's purpose and account, updates the site. It sets Mapped when the pass is done. The server checks: Every current claim of the subsystem has a recorded challenge outcome; Every file that carries the survey obligation has been examined or deferred with a reason; The whole store has been reconciled against the repository at its head; Every concern disposition the subsystem holds has evidence attached whose revision resolves.</li><li id="survey-workflow-checkpoint-5">After Packaging: A summary of the subsystem is posted in your chat.</li></ol><p class="diagram-read-at">Read from the vocabulary contract, version 1.2.0.</p></div></figure>
<figure class="diagram" data-diagram="status-ladder"><figcaption><strong>The survey depths</strong> <span>What are the survey depths, and what does the server ask before each?</span></figcaption><div class="diagram-frame" style="max-width:100%;overflow-x:auto"><svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 960 426" width="960" role="img" aria-labelledby="diagram-status-ladder-title diagram-status-ladder-desc"><title id="diagram-status-ladder-title">The survey depths</title><desc id="diagram-status-ladder-desc">7 boxes and 5 arrows: What are the survey depths, and what does the server ask before each?</desc><path data-edge="ladder-step:unmapped:scoping" d="M 129.5 366 L 166.5 350" fill="none" stroke="var(--accent)" stroke-width="1.5"/><polygon aria-hidden="true" points="166.5,350 160,357.7 156.4,349.4" fill="var(--accent)"/><path data-edge="ladder-step:scoping:structural" d="M 263.5 308 L 300.5 292" fill="none" stroke="var(--accent)" stroke-width="1.5"/><polygon aria-hidden="true" points="300.5,292 294,299.7 290.4,291.4" fill="var(--accent)"/><path data-edge="ladder-step:structural:concerns" d="M 397.5 250 L 434.5 234" fill="none" stroke="var(--accent)" stroke-width="1.5"/><polygon aria-hidden="true" points="434.5,234 428,241.7 424.4,233.4" fill="var(--accent)"/><path data-edge="ladder-step:concerns:adversarial" d="M 531.5 192 L 568.5 176" fill="none" stroke="var(--accent)" stroke-width="1.5"/><polygon aria-hidden="true" points="568.5,176 562,183.7 558.4,175.4" fill="var(--accent)"/><path data-edge="ladder-step:adversarial:mapped" d="M 665.5 134 L 702.5 118" fill="none" stroke="var(--accent)" stroke-width="1.5"/><polygon aria-hidden="true" points="702.5,118 696,125.7 692.4,117.4" fill="var(--accent)"/><g data-node="status:unmapped"><a href="#status-ladder-unmapped"><rect x="31" y="368" width="100" height="38" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="81" y="391.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="81" y="391.2">Unmapped</tspan></text></a></g><g data-node="status:scoping"><a href="#status-ladder-scoping"><rect x="165" y="310" width="100" height="38" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="215" y="333.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="215" y="333.2">Scoped</tspan></text></a></g><g data-node="status:structural"><a href="#status-ladder-structural"><rect x="299" y="252" width="100" height="38" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="349" y="275.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="349" y="275.2">Structural</tspan></text></a></g><g data-node="status:concerns"><a href="#status-ladder-concerns"><rect x="433" y="194" width="100" height="38" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="483" y="209.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="483" y="209.7">Reviewing</tspan><tspan x="483" y="224.7">concerns</tspan></text></a></g><g data-node="status:adversarial"><a href="#status-ladder-adversarial"><rect x="567" y="136" width="100" height="38" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="617" y="151.7" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="617" y="151.7">Challenging</tspan><tspan x="617" y="166.7">claims</tspan></text></a></g><g data-node="status:mapped"><a href="#status-ladder-mapped"><rect x="701" y="78" width="100" height="38" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1"/><text x="751" y="101.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="751" y="101.2">Mapped</tspan></text></a></g><g data-node="status:deferred"><a href="#status-ladder-deferred"><rect x="835" y="368" width="100" height="38" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="5 3"/><text x="885" y="391.2" text-anchor="middle" font-family="var(--heading)" font-size="12" font-weight="600" fill="var(--text)"><tspan x="885" y="391.2">Deferred</tspan></text></a></g></svg></div><div class="diagram-account"><p>A subsystem climbs one rung at a time, from the bottom. Each rung authorizes more of what a reader may rely on, and the server checks the prerequisites below before it lets a subsystem reach one.</p><ol class="diagram-items"><li id="status-ladder-unmapped">Unmapped. This subsystem has not yet been surveyed; no architectural claims are authorized. The server asks nothing of it.</li><li id="status-ladder-scoping">Scoped. The scope pass is done: the subsystem's boundary and files are established, nothing more. The server asks nothing of it.</li><li id="status-ladder-structural">Structural. The structure pass is done: types, state, flows and concurrency are mapped; correctness claims are not yet authorized. The server checks before it: The file ledger lists at least one file; At least one current structural claim is recorded for the subsystem; A term the scope pass found is defined, or its definition is declined with a reason.</li><li id="status-ladder-concerns">Reviewing concerns. Structural mapping is complete and concern-by-concern review is in progress. The server checks before it: A structure narrative is recorded or declined, or an imported survey body is kept; Every concern disposition the subsystem holds has evidence attached whose revision resolves.</li><li id="status-ladder-adversarial">Challenging claims. Candidate conclusions are being challenged; treat them as provisional. The server checks before it: At least one concern disposition is recorded; Every concern disposition the subsystem holds has evidence attached whose revision resolves.</li><li id="status-ladder-mapped">Mapped. Survey complete through structural analysis, concern review, and adversarial challenge. The server checks before it: Every current claim of the subsystem has a recorded challenge outcome; Every file that carries the survey obligation has been examined or deferred with a reason; The whole store has been reconciled against the repository at its head; Every concern disposition the subsystem holds has evidence attached whose revision resolves.</li><li id="status-ladder-deferred">Deferred. This subsystem is intentionally outside the active survey plan. It parks a subsystem outside the ladder: it is not a rung, and a parked subsystem resumes from the depth it held.</li></ol><p class="diagram-read-at">Read from the vocabulary contract, version 1.2.0.</p></div></figure>
<p><strong>Refresh</strong>, when the code changes. The agent re-reads files that changed since it read them. Until then they are listed on Stale knowledge.</p>
<h3 id="what-it-expects-from-you"><a class="heading-anchor" href="#what-it-expects-from-you" aria-label="Link to What it expects from you">§</a>What it expects from you</h3>
<ul><li>Nothing, for it to keep going. When it cannot decide something, it records a <em>decision needed</em> with the assumption it used, and carries on.</li><li>At each checkpoint (after onboarding, after each subsystem, and at the start of each session) it posts a summary in your chat. Read <strong>Decisions needed</strong> then, and answer what you can by telling the agent in your session. This site is read-only; answers reach the record only through the agent.</li><li>You can redirect it at any time: name a subsystem to survey next, say "stop", or ask "what do we know about <code>&lt;file&gt;</code>".</li></ul>
<h3 id="phase-numbers"><a class="heading-anchor" href="#phase-numbers" aria-label="Link to Phase numbers">§</a>Phase numbers</h3>
<p>Notes written by the agent may say "Phase 2". The numbers belong to one of two sequences:</p>
<div class="table-wrap"><table><caption>how a survey works</caption><thead><tr><th scope="col">Numbering</th><th scope="col">Phases</th><th scope="col">What they are</th></tr></thead><tbody><tr><td data-label="Numbering">Onboarding</td><td data-label="Phases">0–7</td><td data-label="What they are">The one-time stage above, before any subsystem is surveyed.</td></tr><tr><td data-label="Numbering">Subsystem survey</td><td data-label="Phases">1–5</td><td data-label="What they are">Scope (1), Structure (2), Concern review (3), Challenge (4), Packaging (5), in order.</td></tr></tbody></table></div>
</section>
<section class="section-terms">
<h2 id="terms"><a class="heading-anchor" href="#terms" aria-label="Link to Terms">§</a>Terms</h2>
<p>Words this site uses in a particular sense. Each entry says where you will meet it.</p>
<span id="term-amanuensis" class="record-anchor"></span>
<h3 id="amanuensis"><a class="heading-anchor" href="#amanuensis" aria-label="Link to Amanuensis">§</a>Amanuensis</h3>
<p>The tool that produced this site. An AI agent runs it to survey a repository.</p>
<p>Seen on: <a href="index.html">Overview</a>, <a href="sessions.html">Sessions and publications</a></p>
<span id="term-conspectus" class="record-anchor"></span>
<h3 id="conspectus"><a class="heading-anchor" href="#conspectus" aria-label="Link to Conspectus">§</a>Conspectus</h3>
<p><em>Also called: survey record.</em></p>
<p>Amanuensis's name for what a survey keeps: a database of what was read and concluded, plus this site, which is built from it.</p>
<p>Seen on: <a href="index.html">Overview</a>, <a href="onboarding-report.html">Onboarding record</a></p>
<span id="term-survey" class="record-anchor"></span>
<h3 id="survey"><a class="heading-anchor" href="#survey" aria-label="Link to Survey">§</a>Survey</h3>
<p>The agent's reading of the repository, done in passes, with each conclusion tied to the code it read.</p>
<p>Seen on: <a href="index.html">Overview</a>, <a href="not-yet-surveyed.html">Not yet surveyed</a>, <a href="sessions.html">Sessions and publications</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-session" class="record-anchor"></span>
<h3 id="session"><a class="heading-anchor" href="#session" aria-label="Link to Session">§</a>Session</h3>
<p>One stretch of work by the agent. Sessions and publications lists them.</p>
<p>Seen on: <a href="sessions.html">Sessions and publications</a>, <a href="resolution-history.html">Resolution history</a>, <a href="entry-point.html">Where to begin</a>, <a href="index.html">Overview</a></p>
<span id="term-subsystem" class="record-anchor"></span>
<h3 id="subsystem"><a class="heading-anchor" href="#subsystem" aria-label="Link to Subsystem">§</a>Subsystem</h3>
<p>A part of the codebase the survey treats as one unit, with its own files and its own page. The agent chose the split during onboarding.</p>
<p>Seen on: <a href="master-plan.html">Subsystems</a>, <a href="architecture.html">Architecture</a>, <a href="onboarding-report.html">Onboarding record</a>, <a href="master-plan.html">Subsystem pages</a>, <a href="index.html">Overview</a>, <a href="not-yet-surveyed.html">Not yet surveyed</a>, <a href="hot-spots.html">Hot spots</a>, <a href="disagreements.html">Disagreements</a>, <a href="diagnosticity.html">Competing explanations</a>, <a href="diagnosticity.html">Evidence tables</a></p>
<span id="term-layer" class="record-anchor"></span>
<h3 id="layer"><a class="heading-anchor" href="#layer" aria-label="Link to Layer">§</a>Layer</h3>
<p><em>Also called: region.</em></p>
<p>A group of subsystems with a similar role. Pages group subsystems by layer.</p>
<p>Seen on: <a href="master-plan.html">Subsystems</a>, <a href="architecture.html">Architecture</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-survey-depth" class="record-anchor"></span>
<h3 id="survey-depth"><a class="heading-anchor" href="#survey-depth" aria-label="Link to Survey depth">§</a>Survey depth</h3>
<p><em>Also called: status.</em></p>
<p>How far the survey of a subsystem has got. Unmapped: not started. Scoped and Structural: that pass is done. Reviewing concerns and Challenging claims: that pass is under way. Mapped: every pass is done. Deferred: left out of the survey on purpose. Each depth limits what the record may claim.</p>
<p>Seen on: <a href="master-plan.html">Subsystems</a>, <a href="architecture.html">Architecture</a>, <a href="not-yet-surveyed.html">Not yet surveyed</a>, <a href="master-plan.html">Subsystem pages</a>, <a href="index.html">Overview</a></p>
<span id="term-mapped" class="record-anchor"></span>
<h3 id="mapped"><a class="heading-anchor" href="#mapped" aria-label="Link to Mapped">§</a><span class="status status-survey status-mapped" title="Survey complete through structural analysis, concern review, and adversarial challenge.">Mapped</span></h3>
<p>The last survey depth: every pass has run. It does not mean every file is read or every bug found.</p>
<p>Seen on: <a href="master-plan.html">Subsystems</a>, <a href="not-yet-surveyed.html">Not yet surveyed</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-scope" class="record-anchor"></span>
<h3 id="scope"><a class="heading-anchor" href="#scope" aria-label="Link to Scope">§</a>Scope</h3>
<p><em>Also called: file ledger.</em></p>
<p>The files a subsystem owns, each marked as read, not yet read, or left out with a reason.</p>
<p>Seen on: <a href="files.html">Files</a>, <a href="not-yet-surveyed.html">Not yet surveyed</a>, <a href="master-plan.html">Subsystem pages</a>, <a href="index.html">Overview</a>, <a href="master-plan.html">Subsystems</a></p>
<span id="term-evidence" class="record-anchor"></span>
<h3 id="evidence"><a class="heading-anchor" href="#evidence" aria-label="Link to Evidence">§</a>Evidence</h3>
<p>A pointer to code at a commit (file, symbol, lines) with a note of how strong it is: read in code, seen in a test, stated in a comment, and so on.</p>
<p>Seen on: <a href="findings.html">Open findings</a>, <a href="resolved-findings.html">Resolved findings</a>, <a href="concerns.html">Review coverage</a>, <a href="master-plan.html">Subsystem pages</a>, <a href="contradictions.html">Conflicting evidence</a>, <a href="disagreements.html">Disagreements</a>, <a href="hot-spots.html">Hot spots</a></p>
<span id="term-claim" class="record-anchor"></span>
<h3 id="claim"><a class="heading-anchor" href="#claim" aria-label="Link to Claim">§</a>Claim</h3>
<p>A statement about how the code is built ("this cache is per request"), with evidence.</p>
<p>Seen on: <a href="disagreements.html">Disagreements</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-challenge" class="record-anchor"></span>
<h3 id="challenge"><a class="heading-anchor" href="#challenge" aria-label="Link to Challenge">§</a>Challenge</h3>
<p><em>Also called: adversarial pass.</em></p>
<p>A pass in which the agent tries to prove its own claims and findings wrong. Each claim records whether it survived.</p>
<p>Seen on: <a href="findings.html">Open findings</a>, <a href="resolved-findings.html">Resolved findings</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-concern" class="record-anchor"></span>
<h3 id="concern"><a class="heading-anchor" href="#concern" aria-label="Link to Concern">§</a>Concern</h3>
<p>One kind of defect worth looking for in this codebase, such as a race on a shared cache. The review checklist is the full list.</p>
<p>Seen on: <a href="concerns.html">Review coverage</a>, <a href="concern-checklist.html">Review checklist</a>, <a href="seams.html">System boundaries</a>, <a href="not-yet-surveyed.html">Not yet surveyed</a>, <a href="diagnosticity.html">Competing explanations</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-concern-review" class="record-anchor"></span>
<h3 id="concern-review"><a class="heading-anchor" href="#concern-review" aria-label="Link to Concern review">§</a>Concern review</h3>
<p><em>Also called: disposition.</em></p>
<p>The verdict for one concern in one subsystem: bug found, acceptable, ruled out, out of scope, or undecided.</p>
<p>Seen on: <a href="concerns.html">Review coverage</a>, <a href="master-plan.html">Subsystem pages</a>, <a href="disagreements.html">Disagreements</a></p>
<span id="term-finding" class="record-anchor"></span>
<h3 id="finding"><a class="heading-anchor" href="#finding" aria-label="Link to Finding">§</a>Finding</h3>
<p>A defect the survey confirmed, with evidence, a severity, and a state (open, repaired, verified, ruled out, accepted).</p>
<p>Seen on: <a href="findings.html">Open findings</a>, <a href="resolved-findings.html">Resolved findings</a>, <a href="hot-spots.html">Hot spots</a>, <a href="files.html">Files</a>, <a href="master-plan.html">Subsystem pages</a>, <a href="index.html">Overview</a>, <a href="master-plan.html">Subsystems</a>, <a href="disagreements.html">Disagreements</a></p>
<span id="term-lead" class="record-anchor"></span>
<h3 id="lead"><a class="heading-anchor" href="#lead" aria-label="Link to Lead">§</a>Lead</h3>
<p><em>Also called: field note.</em></p>
<p>Something the agent noticed that is not a finding: a pattern, an oddity, a tension, a possible concern.</p>
<p>Seen on: <a href="field-notes.html">Leads</a>, <a href="resolved-leads.html">Resolved leads and questions</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-decision-needed" class="record-anchor"></span>
<h3 id="decision-needed"><a class="heading-anchor" href="#decision-needed" aria-label="Link to Decision needed">§</a>Decision needed</h3>
<p><em>Also called: open question.</em></p>
<p>Something the agent could not settle alone. It records the assumption it used and keeps going; you answer it.</p>
<p>Seen on: <a href="open-questions.html">Decisions needed</a>, <a href="resolved-leads.html">Resolved leads and questions</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-disagreement" class="record-anchor"></span>
<h3 id="disagreement"><a class="heading-anchor" href="#disagreement" aria-label="Link to Disagreement">§</a>Disagreement</h3>
<p><em>Also called: contradiction.</em></p>
<p>Two records that cannot both be true. The survey keeps both until one is settled.</p>
<p>Seen on: <a href="disagreements.html">Disagreements</a>, <a href="contradictions.html">Conflicting evidence</a></p>
<span id="term-competing-explanations" class="record-anchor"></span>
<h3 id="competing-explanations"><a class="heading-anchor" href="#competing-explanations" aria-label="Link to Competing explanations">§</a>Competing explanations</h3>
<p><em>Also called: diagnosticity matrix.</em></p>
<p>A table weighing several causes for one symptom against the evidence.</p>
<p>Seen on: <a href="diagnosticity.html">Competing explanations</a>, <a href="diagnosticity.html">Evidence tables</a>, <a href="disagreements.html">Disagreements</a></p>
<span id="term-system-boundary" class="record-anchor"></span>
<h3 id="system-boundary"><a class="heading-anchor" href="#system-boundary" aria-label="Link to System boundary">§</a>System boundary</h3>
<p><em>Also called: seam.</em></p>
<p>A place where two subsystems share something (a table, a queue, a cache) and depend on each other's assumptions about it.</p>
<p>Seen on: <a href="seams.html">System boundaries</a>, <a href="architecture.html">Architecture</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-recorded-edge" class="record-anchor"></span>
<h3 id="recorded-edge"><a class="heading-anchor" href="#recorded-edge" aria-label="Link to Recorded edge">§</a>Recorded edge</h3>
<p><em>Also called: xref.</em></p>
<p>A dependency or data flow between two subsystems that the agent wrote down. Edges are never guessed from names.</p>
<p>Seen on: <a href="architecture.html">Architecture</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-stale" class="record-anchor"></span>
<h3 id="stale"><a class="heading-anchor" href="#stale" aria-label="Link to Stale">§</a>Stale</h3>
<p>A file that changed after the revision the survey recorded for it: the one it was read at, scoped at, or set aside at. What the survey said about it may no longer hold.</p>
<p>Seen on: <a href="stale.html">Stale knowledge</a>, <a href="files.html">Files</a>, <a href="index.html">Overview</a>, <a href="hot-spots.html">Hot spots</a></p>
<span id="term-checked-at" class="record-anchor"></span>
<h3 id="checked-at"><a class="heading-anchor" href="#checked-at" aria-label="Link to Checked at">§</a>Checked at</h3>
<p><em>Also called: revision.</em></p>
<p>The commit the survey last compared itself against. Everything on the site is as of that commit.</p>
<p>Seen on: <a href="index.html">Overview</a>, <a href="stale.html">Stale knowledge</a></p>
<span id="term-standing" class="record-anchor"></span>
<h3 id="standing"><a class="heading-anchor" href="#standing" aria-label="Link to Standing">§</a>Standing</h3>
<p>What the record says about one file: no record, left out, in scope but unread, read, read but changed since.</p>
<p>Seen on: <a href="files.html">Files</a>, <a href="stale.html">Stale knowledge</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-lens" class="record-anchor"></span>
<h3 id="lens"><a class="heading-anchor" href="#lens" aria-label="Link to Lens">§</a>Lens</h3>
<p>One of four groups of pages: Codebase (what the project is), Unresolved (open work), History (what was settled), Method (how far to trust the rest).</p>
<p>Seen on: <a href="index.html">Overview</a></p>
<span id="term-thesis" class="record-anchor"></span>
<h3 id="thesis"><a class="heading-anchor" href="#thesis" aria-label="Link to Thesis">§</a>Thesis</h3>
<p>The paragraph on the overview that says what the codebase does.</p>
<p>Seen on: <a href="index.html">Overview</a></p>
<span id="term-purpose-account" class="record-anchor"></span>
<h3 id="purpose-account"><a class="heading-anchor" href="#purpose-account" aria-label="Link to Purpose, account">§</a>Purpose, account</h3>
<p><em>Also called: explanation.</em></p>
<p>A subsystem's one-sentence purpose and its longer explanation of how it works, each written from evidence.</p>
<p>Seen on: <a href="architecture.html">Architecture</a>, <a href="master-plan.html">Subsystem pages</a></p>
<span id="term-publication-check" class="record-anchor"></span>
<h3 id="publication-check"><a class="heading-anchor" href="#publication-check" aria-label="Link to Publication check">§</a>Publication check</h3>
<p><em>Also called: read-back.</em></p>
<p>After building the site, Amanuensis reads it back to confirm it matches the record. The overview shows the result.</p>
<p>Seen on: <a href="index.html">Overview</a>, <a href="sessions.html">Sessions and publications</a></p>
</section>
<section class="section-how-ids-are-formed">
<h2 id="how-ids-are-formed"><a class="heading-anchor" href="#how-ids-are-formed" aria-label="Link to How IDs are formed">§</a>How IDs are formed</h2>
<p>IDs are short labels so records can point at each other. Except where this page says otherwise, the letters are not a code: read the name beside the ID.</p>
<p>The letters were chosen when the survey began and do not encode anything. Read the name beside the ID.</p>
<div class="table-wrap"><table><caption>how ids are formed</caption><thead><tr><th scope="col">Kind</th><th scope="col">Shape</th><th scope="col">Names</th><th scope="col">Chosen by</th><th scope="col">Example here</th><th scope="col">Links to</th></tr></thead><tbody><tr><td data-label="Kind">Subsystem</td><td data-label="Shape">letters, dash, number: <code>R-06</code></td><td data-label="Names">a subsystem</td><td data-label="Chosen by">the agent, at onboarding</td><td data-label="Example here"><a href="subsystems/b01-survey-method.html"><abbr class="identifier-definition" title="B-01 — Survey method: B-01 tells the agent what to read and what to record." aria-label="B-01 — Survey method: B-01 tells the agent what to read and what to record.">B-01</abbr></a> (Survey method)</td><td data-label="Links to">the subsystem's page</td></tr><tr><td data-label="Kind">Finding</td><td data-label="Shape">subsystem code, dash, sequence: <code>R06-2</code></td><td data-label="Names">a defect in that subsystem</td><td data-label="Chosen by">the agent, when it records the finding</td><td data-label="Example here">none yet</td><td data-label="Links to">Open or Resolved findings</td></tr><tr><td data-label="Kind">Seam</td><td data-label="Shape"><code>SM-</code> and a number: <code>SM-03</code></td><td data-label="Names">a system boundary</td><td data-label="Chosen by">the agent</td><td data-label="Example here">none yet</td><td data-label="Links to">System boundaries</td></tr><tr><td data-label="Kind">Concern</td><td data-label="Shape">short letters, dash, number: <code>RC-2</code></td><td data-label="Names">a checklist item</td><td data-label="Chosen by">the agent, at onboarding</td><td data-label="Example here"><a href="concerns.html#cc-1">concern <abbr class="identifier-definition" title="CC-1 — Data Integrity" aria-label="CC-1 — Data Integrity">CC-1</abbr></a></td><td data-label="Links to">Review coverage</td></tr><tr><td data-label="Kind">Seam concern</td><td data-label="Shape"><code>SC-</code> and a number</td><td data-label="Names">a checklist item about one boundary</td><td data-label="Chosen by">the agent</td><td data-label="Example here">none yet</td><td data-label="Links to">Review coverage</td></tr><tr><td data-label="Kind">Competing explanations</td><td data-label="Shape"><code>DM-</code> and a number</td><td data-label="Names">one evidence table</td><td data-label="Chosen by">numbered by Amanuensis</td><td data-label="Example here">none yet</td><td data-label="Links to">its own page</td></tr><tr><td data-label="Kind">Decision</td><td data-label="Shape"><code>#</code> and a number</td><td data-label="Names">a decision needed</td><td data-label="Chosen by">numbered by Amanuensis</td><td data-label="Example here">none yet</td><td data-label="Links to">Decisions needed</td></tr></tbody></table></div>
</section>
<section class="section-status-values">
<h2 id="status-values"><a class="heading-anchor" href="#status-values" aria-label="Link to Status values">§</a>Status values</h2>
<p>The values this site prints as labels, from the vocabulary contract, version <code>1.2.0</code>: the same source the server checks writes against. Each table gives the label, what it means, and what it cannot justify.</p>
<h3 id="finding-state"><a class="heading-anchor" href="#finding-state" aria-label="Link to Finding state">§</a>Finding state</h3>
<p>Stored as <code>finding_resolution_state</code> · resolution axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>open</code></td><td data-label="Label"><span class="status status-resolution status-open" title="No terminal resolution event has been recorded; the item is still open.">Open</span></td><td data-label="What it means">No terminal resolution event has been recorded; the item is still open.</td><td data-label="What it cannot justify">that the defect is still reproducible at the repository head</td></tr><tr><td data-label="Value"><code>accepted</code></td><td data-label="Label"><span class="status status-resolution status-accepted" title="The behavior is recorded as understood and acceptable; it is not an open defect.">Accepted</span></td><td data-label="What it means">The behavior is recorded as understood and acceptable; it is not an open defect.</td><td data-label="What it cannot justify">that the judgement was revisited at the repository head</td></tr><tr><td data-label="Value"><code>ruled-out</code></td><td data-label="Label">Ruled out</td><td data-label="What it means">The candidate problem was overturned by evidence or adversarial review.</td><td data-label="What it cannot justify">that no related defect exists at the same locus</td></tr><tr><td data-label="Value"><code>fixed-pending-verification</code></td><td data-label="Label">Unverified fix</td><td data-label="What it means">A repair is recorded, but independent fix evidence has not yet closed the finding.</td><td data-label="What it cannot justify">that the defect is gone at the repository head</td></tr><tr><td data-label="Value"><code>verified-fixed</code></td><td data-label="Label">Verified fixed</td><td data-label="What it means">A later revision contains a repair backed by recorded verification evidence.</td><td data-label="What it cannot justify">that the repair is still present at the repository head</td></tr></tbody></table></div>
<h3 id="file-standing"><a class="heading-anchor" href="#file-standing" aria-label="Link to File standing">§</a>File standing</h3>
<p>Stored as <code>standing_state</code> · standing axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>unledgered</code></td><td data-label="Label">No record</td><td data-label="What it means">No file_ledger row names this path in any subsystem.</td><td data-label="What it cannot justify">"there are no findings here"; "this file is out of scope"</td></tr><tr><td data-label="Value"><code>excluded</code></td><td data-label="Label">Excluded</td><td data-label="What it means">A ledger row classifies the path as generated, vendored, irrelevant, or deferred with a recorded reason.</td><td data-label="What it cannot justify">any claim about the file's content or behavior</td></tr><tr><td data-label="Value"><code>scoped-unread</code></td><td data-label="Label">In scope, not yet read</td><td data-label="What it means">A ledger row classifies the path candidate: it participates in a subsystem, and no one has read it.</td><td data-label="What it cannot justify">any claim about content, behavior, or the absence of defects</td></tr><tr><td data-label="Value"><code>examined</code></td><td data-label="Label">Examined</td><td data-label="What it means">A ledger row classifies the path examined, it is not stale, and its examination revision resolves in the workspace.</td><td data-label="What it cannot justify">claims about symbols no evidence cites; the absence of defects</td></tr><tr><td data-label="Value"><code>examined-stale</code></td><td data-label="Label">Examined, since changed</td><td data-label="What it means">The path was examined, and drift, absence, or an unreachable examination revision has withdrawn that reading's currency.</td><td data-label="What it cannot justify">any current claim at the repository head</td></tr><tr><td data-label="Value"><code>absent</code></td><td data-label="Label">No longer in the repository</td><td data-label="What it means">A scope_gaps row of kind absent, or a ledger row whose stale_reason is absent.</td><td data-label="What it cannot justify">anything at the repository head</td></tr><tr><td data-label="Value"><code>mixed</code></td><td data-label="Label">Owners disagree</td><td data-label="What it means">Two or more owning subsystems record different standing states for the same path.</td><td data-label="What it cannot justify">anything the weakest owner state cannot justify</td></tr></tbody></table></div>
<h3 id="why-a-file-is-stale"><a class="heading-anchor" href="#why-a-file-is-stale" aria-label="Link to Why a file is stale">§</a>Why a file is stale</h3>
<p>Stored as <code>stale_reason</code> · standing axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>git-drift</code></td><td data-label="Label">Changed since examination</td><td data-label="What it means">The file's content differs from the revision it was examined at.</td><td data-label="What it cannot justify">that the recorded reading is wrong, only that it is no longer current</td></tr><tr><td data-label="Value"><code>absent</code></td><td data-label="Label">Gone from the repository</td><td data-label="What it means">The examined path is no longer tracked in the workspace.</td><td data-label="What it cannot justify">anything about the current tree at that path</td></tr><tr><td data-label="Value"><code>unverifiable-ref</code></td><td data-label="Label">Examination revision cannot be compared</td><td data-label="What it means">The examination revision could not be diffed against the current head, so drift could not be computed.</td><td data-label="What it cannot justify">that the file did or did not change</td></tr><tr><td data-label="Value"><code>unreachable-ref</code></td><td data-label="Label">Examination revision is not an ancestor</td><td data-label="What it means">The examination revision resolves in the workspace but is not an ancestor of the current head.</td><td data-label="What it cannot justify">any current claim at the repository head</td></tr></tbody></table></div>
<h3 id="file-scope"><a class="heading-anchor" href="#file-scope" aria-label="Link to File scope">§</a>File scope</h3>
<p>Stored as <code>file_classification</code> · standing axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>candidate</code></td><td data-label="Label">In scope, not yet read</td><td data-label="What it means">The path participates in a subsystem and has not been read.</td><td data-label="What it cannot justify">any claim about content or behavior</td></tr><tr><td data-label="Value"><code>examined</code></td><td data-label="Label">Examined</td><td data-label="What it means">The path was read and its reading is anchored to an examination revision.</td><td data-label="What it cannot justify">claims about symbols no evidence cites</td></tr><tr><td data-label="Value"><code>generated-ignore</code></td><td data-label="Label">Generated</td><td data-label="What it means">The path is build or projection output and is not read as a source of claims.</td><td data-label="What it cannot justify">anything about the generator that produced it</td></tr><tr><td data-label="Value"><code>vendor-ignore</code></td><td data-label="Label">Vendored</td><td data-label="What it means">The path is third-party code carried in the tree and is not surveyed.</td><td data-label="What it cannot justify">anything about the upstream project's behavior</td></tr><tr><td data-label="Value"><code>irrelevant</code></td><td data-label="Label">Ruled irrelevant</td><td data-label="What it means">The path was judged to carry nothing the survey needs.</td><td data-label="What it cannot justify">that the judgement was re-examined at the repository head</td></tr><tr><td data-label="Value"><code>deferred-with-reason</code></td><td data-label="Label"><span class="status status-survey status-deferred" title="This subsystem is intentionally outside the active survey plan.">Deferred</span></td><td data-label="What it means">The path is in scope but deliberately left unread, with the reason recorded.</td><td data-label="What it cannot justify">any claim about content or behavior</td></tr></tbody></table></div>
<h3 id="survey-depth-2"><a class="heading-anchor" href="#survey-depth-2" aria-label="Link to Survey depth">§</a>Survey depth</h3>
<p>Stored as <code>subsystem_status</code> · survey axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>unmapped</code></td><td data-label="Label"><span class="status status-survey status-unmapped" title="This subsystem has not yet been surveyed; no architectural claims are authorized.">Unmapped</span></td><td data-label="What it means">This subsystem has not yet been surveyed; no architectural claims are authorized.</td><td data-label="What it cannot justify">any claim about this subsystem's behavior</td></tr><tr><td data-label="Value"><code>scoping</code></td><td data-label="Label">Scoped</td><td data-label="What it means">The scope pass is done: the subsystem's boundary and files are established, nothing more.</td><td data-label="What it cannot justify">any behavioral claim; file scope is all that is established</td></tr><tr><td data-label="Value"><code>structural</code></td><td data-label="Label"><span class="status status-survey status-structural" title="The structure pass is done: types, state, flows and concurrency are mapped; correctness claims are not yet authorized.">Structural</span></td><td data-label="What it means">The structure pass is done: types, state, flows and concurrency are mapped; correctness claims are not yet authorized.</td><td data-label="What it cannot justify">any correctness claim</td></tr><tr><td data-label="Value"><code>concerns</code></td><td data-label="Label">Reviewing concerns</td><td data-label="What it means">Structural mapping is complete and concern-by-concern review is in progress.</td><td data-label="What it cannot justify">that a finding survived adversarial challenge</td></tr><tr><td data-label="Value"><code>adversarial</code></td><td data-label="Label">Challenging claims</td><td data-label="What it means">Candidate conclusions are being challenged; treat them as provisional.</td><td data-label="What it cannot justify">that the challenge pass has finished</td></tr><tr><td data-label="Value"><code>mapped</code></td><td data-label="Label"><span class="status status-survey status-mapped" title="Survey complete through structural analysis, concern review, and adversarial challenge.">Mapped</span></td><td data-label="What it means">Survey complete through structural analysis, concern review, and adversarial challenge.</td><td data-label="What it cannot justify">that the reading is current at the repository head</td></tr><tr><td data-label="Value"><code>deferred</code></td><td data-label="Label"><span class="status status-survey status-deferred" title="This subsystem is intentionally outside the active survey plan.">Deferred</span></td><td data-label="What it means">This subsystem is intentionally outside the active survey plan.</td><td data-label="What it cannot justify">anything about this subsystem's behavior</td></tr></tbody></table></div>
<h3 id="evidence-kind"><a class="heading-anchor" href="#evidence-kind" aria-label="Link to Evidence kind">§</a>Evidence kind</h3>
<p>Stored as <code>evidence_kind</code> · evidence axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>code-verified</code></td><td data-label="Label">Code verified</td><td data-label="What it means">The implementation was read and the stated behavior was verified directly.</td><td data-label="What it cannot justify">behavior at any revision other than the one cited</td></tr><tr><td data-label="Value"><code>runtime-observed</code></td><td data-label="Label">Runtime observed</td><td data-label="What it means">The behavior was observed in a running system and the observation was recorded.</td><td data-label="What it cannot justify">that the same behavior holds under other inputs or configurations</td></tr><tr><td data-label="Value"><code>contract-stated</code></td><td data-label="Label">Contract stated</td><td data-label="What it means">An explicit schema, type, or behavioral contract states this claim.</td><td data-label="What it cannot justify">that the implementation honors the contract</td></tr><tr><td data-label="Value"><code>test-observed</code></td><td data-label="Label">Test observed</td><td data-label="What it means">A test run or recorded observation demonstrates this behavior.</td><td data-label="What it cannot justify">behavior outside what the test exercises</td></tr><tr><td data-label="Value"><code>config-asserted</code></td><td data-label="Label">Config asserted</td><td data-label="What it means">Configuration states the behavior, but runtime behavior was not independently verified.</td><td data-label="What it cannot justify">that this configuration is the one in effect</td></tr><tr><td data-label="Value"><code>doc-asserted</code></td><td data-label="Label">Docs asserted</td><td data-label="What it means">Project documentation states the claim; implementation agreement is not yet verified.</td><td data-label="What it cannot justify">that the implementation matches the documentation</td></tr><tr><td data-label="Value"><code>comment-asserted</code></td><td data-label="Label">Comment asserted</td><td data-label="What it means">A code comment states the claim; the implementation was not verified against it.</td><td data-label="What it cannot justify">that the comment is current with the code beside it</td></tr><tr><td data-label="Value"><code>name-inferred</code></td><td data-label="Label">Name inferred</td><td data-label="What it means">The claim is inferred from a symbol name and should be treated as weak evidence.</td><td data-label="What it cannot justify">any correctness claim; a name is not an implementation</td></tr><tr><td data-label="Value"><code>pattern-matched</code></td><td data-label="Label">Pattern matched</td><td data-label="What it means">The claim matches a known pattern and is only a scoping signal.</td><td data-label="What it cannot justify">any claim about what this locus actually does</td></tr></tbody></table></div>
<h3 id="concern-review-verdict"><a class="heading-anchor" href="#concern-review-verdict" aria-label="Link to Concern review verdict">§</a>Concern review verdict</h3>
<p>Stored as <code>disposition_classification</code> · disposition axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>confirmed-bug</code></td><td data-label="Label">Confirmed defect</td><td data-label="What it means">A defect supported by evidence and retained after adversarial review.</td><td data-label="What it cannot justify">that the defect is unrepaired at the repository head</td></tr><tr><td data-label="Value"><code>confirmed-acceptable</code></td><td data-label="Label">Accepted behavior</td><td data-label="What it means">The observed behavior is real and judged to be intended or acceptable.</td><td data-label="What it cannot justify">that the judgement was revisited at the repository head</td></tr><tr><td data-label="Value"><code>ruled-out</code></td><td data-label="Label">Ruled out</td><td data-label="What it means">The candidate problem was overturned by evidence or adversarial review.</td><td data-label="What it cannot justify">that no related defect exists at the same locus</td></tr><tr><td data-label="Value"><code>out-of-scope</code></td><td data-label="Label">Out of scope</td><td data-label="What it means">The concern does not apply within this subsystem's declared boundary.</td><td data-label="What it cannot justify">that the concern does not apply elsewhere in the project</td></tr><tr><td data-label="Value"><code>unresolved-competition</code></td><td data-label="Label">Competing explanations</td><td data-label="What it means">Multiple explanations remain viable; the evidence does not discriminate.</td><td data-label="What it cannot justify">that any one of the competing explanations is the right one</td></tr></tbody></table></div>
<h3 id="severity"><a class="heading-anchor" href="#severity" aria-label="Link to Severity">§</a>Severity</h3>
<p>Stored as <code>severity</code> · severity axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>CRITICAL</code></td><td data-label="Label"><span class="severity severity-critical" title="Potential data loss, security failure, privilege escalation, or production outage path.">Critical</span></td><td data-label="What it means">Potential data loss, security failure, privilege escalation, or production outage path.</td><td data-label="What it cannot justify">how likely the path is to be reached; severity is impact, not confidence</td></tr><tr><td data-label="Value"><code>HIGH</code></td><td data-label="Label"><span class="severity severity-high" title="Incorrect behavior on a common path, corrupt state, or a seriously wedged workflow.">High</span></td><td data-label="What it means">Incorrect behavior on a common path, corrupt state, or a seriously wedged workflow.</td><td data-label="What it cannot justify">how confident the finding is; severity is impact, not confidence</td></tr><tr><td data-label="Value"><code>MEDIUM</code></td><td data-label="Label"><span class="severity severity-medium" title="Incorrect edge-case behavior or a correctness issue with a known workaround.">Medium</span></td><td data-label="What it means">Incorrect edge-case behavior or a correctness issue with a known workaround.</td><td data-label="What it cannot justify">that the edge case is rare in practice</td></tr><tr><td data-label="Value"><code>LOW</code></td><td data-label="Label"><span class="severity severity-low" title="Maintainability, clarity, or defensive-coding risk most likely to affect a future change.">Low</span></td><td data-label="What it means">Maintainability, clarity, or defensive-coding risk most likely to affect a future change.</td><td data-label="What it cannot justify">that the risk will never be reached</td></tr></tbody></table></div>
<h3 id="lead-category"><a class="heading-anchor" href="#lead-category" aria-label="Link to Lead category">§</a>Lead category</h3>
<p>Stored as <code>field_note_category</code> · lead axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>pattern</code></td><td data-label="Label">Pattern</td><td data-label="What it means">A recurrence noticed in more than one place.</td><td data-label="What it cannot justify">that the recurrence is intentional</td></tr><tr><td data-label="Value"><code>anomaly</code></td><td data-label="Label">Anomaly</td><td data-label="What it means">A deviation from the surrounding conventions or expectations.</td><td data-label="What it cannot justify">that the deviation is a defect</td></tr><tr><td data-label="Value"><code>connection</code></td><td data-label="Label">Connection</td><td data-label="What it means">A relationship noticed across subsystem boundaries.</td><td data-label="What it cannot justify">that the relationship is load-bearing</td></tr><tr><td data-label="Value"><code>tension</code></td><td data-label="Label">Tension</td><td data-label="What it means">Local correctness that sits awkwardly against global coherence.</td><td data-label="What it cannot justify">that either side is wrong</td></tr><tr><td data-label="Value"><code>candidate-concern</code></td><td data-label="Label">Candidate concern</td><td data-label="What it means">A pattern that might warrant a concern code of its own.</td><td data-label="What it cannot justify">that the concern has been reviewed anywhere</td></tr></tbody></table></div>
<h3 id="decision-category"><a class="heading-anchor" href="#decision-category" aria-label="Link to Decision category">§</a>Decision category</h3>
<p>Stored as <code>open_question_category</code> · question axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>domain-knowledge</code></td><td data-label="Label">Domain knowledge</td><td data-label="What it means">A business rule or domain fact the record cannot supply.</td><td data-label="What it cannot justify">the assumption recorded in its place</td></tr><tr><td data-label="Value"><code>scope-judgment</code></td><td data-label="Label">Scope judgment</td><td data-label="What it means">A scope fence that needs a human to confirm.</td><td data-label="What it cannot justify">that the assumed boundary is the right one</td></tr><tr><td data-label="Value"><code>priority-ranking</code></td><td data-label="Label">Priority ranking</td><td data-label="What it means">A survey order the agent guessed and a reviewer can override.</td><td data-label="What it cannot justify">that the ranking reflects project priorities</td></tr><tr><td data-label="Value"><code>contradiction</code></td><td data-label="Label">Contradiction</td><td data-label="What it means">Two credible sources disagree and the record does not settle it.</td><td data-label="What it cannot justify">either reading</td></tr><tr><td data-label="Value"><code>tooling-limit</code></td><td data-label="Label">Tooling limit</td><td data-label="What it means">An operation the agent could not perform.</td><td data-label="What it cannot justify">anything about what that operation would have shown</td></tr><tr><td data-label="Value"><code>ambiguous-evidence</code></td><td data-label="Label">Ambiguous evidence</td><td data-label="What it means">The evidence permits more than one interpretation.</td><td data-label="What it cannot justify">any single interpretation</td></tr><tr><td data-label="Value"><code>other</code></td><td data-label="Label">Other</td><td data-label="What it means">A question that fits none of the recorded categories.</td><td data-label="What it cannot justify">anything beyond the question as asked</td></tr></tbody></table></div>
<h3 id="decision-outcome"><a class="heading-anchor" href="#decision-outcome" aria-label="Link to Decision outcome">§</a>Decision outcome</h3>
<p>Stored as <code>open_question_resolution</code> · resolution axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>open</code></td><td data-label="Label"><span class="status status-resolution status-open" title="No terminal resolution event has been recorded; the item is still open.">Open</span></td><td data-label="What it means">No answer has been recorded.</td><td data-label="What it cannot justify">that the question is still the right one to ask</td></tr><tr><td data-label="Value"><code>answered</code></td><td data-label="Label">Answered</td><td data-label="What it means">A human recorded an answer.</td><td data-label="What it cannot justify">that the answer was applied to the record</td></tr><tr><td data-label="Value"><code>dismissed</code></td><td data-label="Label">Dismissed</td><td data-label="What it means">The question was withdrawn without an answer.</td><td data-label="What it cannot justify">that the underlying uncertainty was resolved</td></tr><tr><td data-label="Value"><code>superseded</code></td><td data-label="Label">Superseded</td><td data-label="What it means">A later question or decision replaced this one.</td><td data-label="What it cannot justify">what the replacement decided</td></tr></tbody></table></div>
<h3 id="how-a-disagreement-was-settled"><a class="heading-anchor" href="#how-a-disagreement-was-settled" aria-label="Link to How a disagreement was settled">§</a>How a disagreement was settled</h3>
<p>Stored as <code>contradiction_resolution</code> · resolution axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>a-supersedes-b</code></td><td data-label="Label">A supersedes B</td><td data-label="What it means">The first finding stands and the second is withdrawn.</td><td data-label="What it cannot justify">that the withdrawn finding was wrong about everything it said</td></tr><tr><td data-label="Value"><code>b-supersedes-a</code></td><td data-label="Label">B supersedes A</td><td data-label="What it means">The second finding stands and the first is withdrawn.</td><td data-label="What it cannot justify">that the withdrawn finding was wrong about everything it said</td></tr><tr><td data-label="Value"><code>scope-distinction</code></td><td data-label="Label">Scope distinction</td><td data-label="What it means">Both findings stand; they apply to scopes the record now distinguishes.</td><td data-label="What it cannot justify">that either finding was re-verified</td></tr><tr><td data-label="Value"><code>unresolved</code></td><td data-label="Label">Unresolved</td><td data-label="What it means">The conflict is recorded and not yet settled.</td><td data-label="What it cannot justify">either finding</td></tr></tbody></table></div>
<h3 id="competing-explanations-outcome"><a class="heading-anchor" href="#competing-explanations-outcome" aria-label="Link to Competing explanations outcome">§</a>Competing explanations outcome</h3>
<p>Stored as <code>diagnosticity_outcome</code> · resolution axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>open</code></td><td data-label="Label"><span class="status status-resolution status-open" title="No terminal resolution event has been recorded; the item is still open.">Open</span></td><td data-label="What it means">The competing explanations have not been analyzed to a verdict.</td><td data-label="What it cannot justify">any one of the competing explanations</td></tr><tr><td data-label="Value"><code>resolved</code></td><td data-label="Label"><span class="status status-resolution status-resolved" title="This item has a recorded resolution.">Resolved</span></td><td data-label="What it means">This item has a recorded resolution.</td><td data-label="What it cannot justify">that the resolution was independently checked</td></tr><tr><td data-label="Value"><code>unresolved-competition</code></td><td data-label="Label">Competing explanations</td><td data-label="What it means">Multiple explanations remain viable; the evidence does not discriminate.</td><td data-label="What it cannot justify">that any one of the competing explanations is the right one</td></tr></tbody></table></div>
<h3 id="lens-2"><a class="heading-anchor" href="#lens-2" aria-label="Link to Lens">§</a>Lens</h3>
<p>Stored as <code>lens</code> · lens axis</p>
<div class="table-wrap"><table><caption>status values</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>codebase</code></td><td data-label="Label">Codebase</td><td data-label="What it means">The recorded account of what the project is, how it works, and which of its territory has not been read.</td><td data-label="What it cannot justify">that unread territory holds no defects</td></tr><tr><td data-label="Value"><code>unresolved</code></td><td data-label="Label">Unresolved</td><td data-label="What it means">Records that have not reached a terminal, evidence-backed state at the checked revision.</td><td data-label="What it cannot justify">that a record here is still reproducible at the repository head</td></tr><tr><td data-label="Value"><code>history</code></td><td data-label="Label">History</td><td data-label="What it means">Records that have reached a terminal state, plus the recorded account of how they got there where one exists.</td><td data-label="What it cannot justify">that a terminal state was re-checked at the repository head</td></tr><tr><td data-label="Value"><code>method</code></td><td data-label="Label">Method</td><td data-label="What it means">The apparatus by which a reader judges how far the rest of the record can be trusted.</td><td data-label="What it cannot justify">any claim about the project itself</td></tr></tbody></table></div>
</section>
<section class="section-full-vocabulary">
<h2 id="full-vocabulary"><a class="heading-anchor" href="#full-vocabulary" aria-label="Link to Full vocabulary">§</a>Full vocabulary</h2>
<details class="vocabulary-disclosure"><summary>Show the full vocabulary</summary>
<p>The remaining values the record stores, which the pages rarely print as labels. They come from the same contract.</p>
<h3 id="carried-finding-outcome"><a class="heading-anchor" href="#carried-finding-outcome" aria-label="Link to Carried finding outcome">§</a>Carried finding outcome</h3>
<p>Stored as <code>carried_finding_outcome</code> · carried axis</p>
<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>successor-finding</code></td><td data-label="Label">Re-found here</td><td data-label="What it means">A finding filed in this store records the same defect, so the carried obligation is discharged into it and a reference to the archived id follows the finding into its successor.</td><td data-label="What it cannot justify">that the successor is the same defect; the substrate can require that a finding was filed in this store and in this session, and cannot read the judgement that the two are one</td></tr><tr><td data-label="Value"><code>ruled-out</code></td><td data-label="Label">Ruled out here</td><td data-label="What it means">A reading taken in this store, in the session that overturned it, does not show the defect the archive recorded.</td><td data-label="What it cannot justify">that no related defect exists at the same locus; overturning requires evidence collected by the overturning pass, not that the locus was exhausted</td></tr><tr><td data-label="Value"><code>repaired</code></td><td data-label="Label">Repaired here</td><td data-label="What it means">A commit that resolves in the bound workspace carries the repair, and at least one attached evidence row was read at a revision that is a descendant of, or equal to, that commit.</td><td data-label="What it cannot justify">that the repair is still present at the repository head, or that it is complete; a claimed repair with no post-repair reading is fixed-pending-verification, never a discharge</td></tr><tr><td data-label="Value"><code>archived-terminal</code></td><td data-label="Label">Closed in the archive</td><td data-label="What it means">The archive had already closed this finding — verified-fixed, ruled-out or accepted — and the carry recorded that state rather than re-deciding it. Written by the carry alone.</td><td data-label="What it cannot justify">anything about this store: nobody here checked a commit or read a repaired path, and the row carries the archive's judgement and not this survey's</td></tr></tbody></table></div>
<h3 id="finding-status"><a class="heading-anchor" href="#finding-status" aria-label="Link to Finding status">§</a>Finding status</h3>
<p>Stored as <code>finding_status</code> · resolution axis</p>
<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>confirmed-bug</code></td><td data-label="Label">Confirmed defect</td><td data-label="What it means">A defect supported by evidence and retained after adversarial review.</td><td data-label="What it cannot justify">that the defect is unrepaired at the repository head; the resolution events are the authority</td></tr><tr><td data-label="Value"><code>confirmed-acceptable</code></td><td data-label="Label">Accepted behavior</td><td data-label="What it means">The observed behavior is real and judged to be intended or acceptable.</td><td data-label="What it cannot justify">that the judgement was revisited at the repository head</td></tr><tr><td data-label="Value"><code>fixed</code></td><td data-label="Label"><span class="status status-resolution status-fixed" title="The defect was confirmed at an earlier revision and is recorded as addressed later.">Fixed</span></td><td data-label="What it means">The defect was confirmed at an earlier revision and is recorded as addressed later.</td><td data-label="What it cannot justify">that verification evidence closed the finding; only a verified-fixed event carries that</td></tr><tr><td data-label="Value"><code>ruled-out</code></td><td data-label="Label">Ruled out</td><td data-label="What it means">The candidate problem was overturned by evidence or adversarial review.</td><td data-label="What it cannot justify">that no related defect exists at the same locus</td></tr></tbody></table></div>
<h3 id="vocabulary-discharge"><a class="heading-anchor" href="#vocabulary-discharge" aria-label="Link to Vocabulary discharge">§</a>Vocabulary discharge</h3>
<p>Stored as <code>vocabulary_discharge</code> · vocabulary axis</p>
<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>terms</code></td><td data-label="Label">Terms recorded</td><td data-label="What it means">The subsystem carries at least one vocabulary term scoped to it whose first_seen anchor still resolves: the token parses, its revision is reachable, and its path exists in that revision's tree.</td><td data-label="What it cannot justify">that the recorded terms are the ones a reader most needs, or that the list is complete; one anchored term discharges the obligation and no count is required</td></tr><tr><td data-label="Value"><code>declined</code></td><td data-label="Label">Declared none</td><td data-label="What it means">A reader examined the subsystem and declared, at a recorded revision and in an attributed session, that it carries no domain vocabulary of its own.</td><td data-label="What it cannot justify">that the judgement is true; the substrate can require that it be made, attributed and dated, and cannot check whether the subsystem really coins nothing</td></tr><tr><td data-label="Value"><code>not-recorded</code></td><td data-label="Label">Not recorded</td><td data-label="What it means">Neither a term nor a declination has been recorded for this subsystem, so nobody has answered the question either way.</td><td data-label="What it cannot justify">that the subsystem has no domain vocabulary; nothing was asked and nothing was answered, which is not the same as 'none'</td></tr></tbody></table></div>
<h3 id="explanation-subject"><a class="heading-anchor" href="#explanation-subject" aria-label="Link to Explanation subject">§</a>Explanation subject</h3>
<p>Stored as <code>explanation_subject</code> · explanation axis</p>
<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>subsystem</code></td><td data-label="Label">Subsystem</td><td data-label="What it means">The explanation is about one subsystem, named by its id.</td><td data-label="What it cannot justify">that the subsystem still has the status it had when the row was written; eligibility is read from the status at the time of each reading</td></tr><tr><td data-label="Value"><code>project</code></td><td data-label="Label">Project</td><td data-label="What it means">The explanation is about the codebase as a whole, and its subject id is the literal 'project'.</td><td data-label="What it cannot justify">that the project's account still matches the subsystems it was written from; the account is recorded once a subsystem has been read to 'structural', and the purpose at any status</td></tr></tbody></table></div>
<h3 id="explanation-slot"><a class="heading-anchor" href="#explanation-slot" aria-label="Link to Explanation slot">§</a>Explanation slot</h3>
<p>Stored as <code>explanation_slot</code> · explanation axis</p>
<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>purpose</code></td><td data-label="Label">Purpose</td><td data-label="What it means">One paragraph on what this part is for, in terms of what the rest of the system or its users get from it.</td><td data-label="What it cannot justify">that the paragraph is a restatement of scope or a list of files; a purpose is a judgement and the record cannot check it</td></tr><tr><td data-label="Value"><code>account</code></td><td data-label="Label">Account</td><td data-label="What it means">A short prose account of how the subject works: its moving parts, the rules it enforces and where, what it depends on, what a newcomer gets wrong, and where to start reading.</td><td data-label="What it cannot justify">that the account is complete or current; it is bound to the revision it was written at</td></tr></tbody></table></div>
<h3 id="explanation-disposition"><a class="heading-anchor" href="#explanation-disposition" aria-label="Link to Explanation disposition">§</a>Explanation disposition</h3>
<p>Stored as <code>explanation_disposition</code> · explanation axis</p>
<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>recorded</code></td><td data-label="Label">Recorded</td><td data-label="What it means">A survey session wrote the explanation, at a revision and over cited evidence.</td><td data-label="What it cannot justify">that the explanation is true; the record establishes who wrote it, at which revision and over which evidence</td></tr><tr><td data-label="Value"><code>declined</code></td><td data-label="Label">Declined</td><td data-label="What it means">A survey session read the subject and declined to write the explanation, with the reason.</td><td data-label="What it cannot justify">that nothing true can be said about the subject; it says only that the session could not say something true and specific</td></tr><tr><td data-label="Value"><code>withdrawn</code></td><td data-label="Label">Withdrawn</td><td data-label="What it means">An earlier explanation was withdrawn, with the reason, and the subject owes a new one.</td><td data-label="What it cannot justify">that the earlier explanation was wrong; it says only that it no longer stands for this subject</td></tr><tr><td data-label="Value"><code>imported</code></td><td data-label="Label">Imported</td><td data-label="What it means">The project's purpose, copied from the entry point an earlier version wrote, with no evidence attached. Only the project purpose may be imported.</td><td data-label="What it cannot justify">that anyone has checked the purpose against the code; the copy carries the old entry point's words as they were</td></tr></tbody></table></div>
<h3 id="explanation-discharge"><a class="heading-anchor" href="#explanation-discharge" aria-label="Link to Explanation discharge">§</a>Explanation discharge</h3>
<p>Stored as <code>explanation_discharge</code> · explanation axis</p>
<div class="table-wrap"><table><caption>full vocabulary</caption><thead><tr><th scope="col">Value</th><th scope="col">Label</th><th scope="col">What it means</th><th scope="col">What it cannot justify</th></tr></thead><tbody><tr><td data-label="Value"><code>recorded</code></td><td data-label="Label">Recorded</td><td data-label="What it means">The effective row for this slot is an explanation a survey session recorded, at a revision the workspace can resolve and over cited evidence.</td><td data-label="What it cannot justify">that the explanation is true; the record establishes who wrote it, at which revision and over which evidence, and not that it is true</td></tr><tr><td data-label="Value"><code>declined</code></td><td data-label="Label">Declined</td><td data-label="What it means">The effective row for this slot is a declination: a survey session read the subject and gave the reason it wrote none.</td><td data-label="What it cannot justify">that nothing can be said about the subject; the reason is a judgement the record keeps and cannot check</td></tr><tr><td data-label="Value"><code>not-recorded</code></td><td data-label="Label">Not recorded</td><td data-label="What it means">There is no effective row for this slot: none was written, the newest one was withdrawn, none resolves at a reachable revision, or the subject is not explanation-eligible.</td><td data-label="What it cannot justify">that the subject has no purpose or account worth writing; nothing was asked or nothing stands, which is not the same as declined</td></tr></tbody></table></div>
<h3 id="evidence-quality"><a class="heading-anchor" href="#evidence-quality" aria-label="Link to Evidence quality">§</a>Evidence quality</h3>
